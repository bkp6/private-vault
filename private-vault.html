<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0a0f">
<title>Vault — 私密相簿</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap');

  :root {
    --bg: #0a0a0f;
    --surface: #13131a;
    --surface2: #1c1c26;
    --border: #2a2a3a;
    --accent: #c8a96e;
    --accent2: #8b6fd4;
    --text: #e8e4dc;
    --muted: #7a7a90;
    --danger: #e05555;
    --r: 14px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100dvh;
    overflow-x: hidden;
    user-select: none;
  }

  /* ── LOCK SCREEN ── */
  #lock-screen {
    position: fixed; inset: 0; z-index: 100;
    background: var(--bg);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 0;
    padding: 40px 24px;
  }

  .lock-logo {
    font-family: 'DM Serif Display', serif;
    font-size: 2.2rem;
    color: var(--accent);
    letter-spacing: 0.05em;
    margin-bottom: 8px;
  }
  .lock-tagline {
    font-size: 0.78rem;
    color: var(--muted);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin-bottom: 56px;
  }

  .pin-dots {
    display: flex; gap: 16px; margin-bottom: 40px;
  }
  .pin-dot {
    width: 14px; height: 14px;
    border-radius: 50%;
    border: 2px solid var(--border);
    transition: all 0.15s;
    background: transparent;
  }
  .pin-dot.filled {
    background: var(--accent);
    border-color: var(--accent);
    transform: scale(1.1);
  }
  .pin-dot.error {
    background: var(--danger);
    border-color: var(--danger);
    animation: shake 0.35s ease;
  }

  @keyframes shake {
    0%,100% { transform: translateX(0); }
    20% { transform: translateX(-6px); }
    60% { transform: translateX(6px); }
  }

  .numpad {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px;
    width: 100%;
    max-width: 280px;
  }

  .num-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r);
    color: var(--text);
    font-size: 1.5rem;
    font-family: 'DM Sans', sans-serif;
    font-weight: 300;
    padding: 18px 0;
    cursor: pointer;
    transition: all 0.12s;
    position: relative;
    overflow: hidden;
  }
  .num-btn:active { background: var(--surface2); transform: scale(0.95); }
  .num-btn.wide { grid-column: span 1; }
  .num-btn.del { font-size: 1rem; color: var(--muted); }
  .num-btn.empty { background: transparent; border-color: transparent; cursor: default; }

  .lock-hint {
    margin-top: 28px;
    font-size: 0.72rem;
    color: var(--muted);
    text-align: center;
    line-height: 1.6;
  }

  /* ── APP SHELL ── */
  #app {
    display: none;
    flex-direction: column;
    min-height: 100dvh;
  }

  /* ── HEADER ── */
  .app-header {
    position: sticky; top: 0; z-index: 10;
    background: rgba(10,10,15,0.9);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    padding: 16px 20px 12px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
  }
  .app-title {
    font-family: 'DM Serif Display', serif;
    font-size: 1.6rem;
    color: var(--accent);
  }
  .header-actions { display: flex; gap: 10px; }

  .icon-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    padding: 8px 12px;
    cursor: pointer;
    font-size: 1rem;
    transition: all 0.12s;
    display: flex; align-items: center; gap: 6px;
  }
  .icon-btn:active { background: var(--surface2); }
  .icon-btn span { font-size: 0.75rem; color: var(--muted); }

  /* ── TABS ── */
  .tabs {
    display: flex;
    padding: 12px 20px 0;
    gap: 4px;
    border-bottom: 1px solid var(--border);
  }
  .tab {
    padding: 8px 16px;
    border-radius: 10px 10px 0 0;
    cursor: pointer;
    font-size: 0.82rem;
    color: var(--muted);
    border: 1px solid transparent;
    border-bottom: none;
    transition: all 0.15s;
    position: relative; bottom: -1px;
  }
  .tab.active {
    color: var(--accent);
    background: var(--surface);
    border-color: var(--border);
    border-bottom-color: var(--surface);
  }

  /* ── MAIN CONTENT ── */
  .content { flex: 1; padding: 20px; }

  /* ── EMPTY STATE ── */
  .empty-state {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 80px 24px;
    text-align: center;
    gap: 12px;
  }
  .empty-icon { font-size: 3rem; opacity: 0.3; }
  .empty-title { font-size: 1rem; color: var(--muted); }
  .empty-sub { font-size: 0.78rem; color: var(--muted); opacity: 0.6; }

  /* ── GRID ── */
  .photo-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 3px;
  }

  .photo-thumb {
    aspect-ratio: 1;
    overflow: hidden;
    position: relative;
    cursor: pointer;
    border-radius: 4px;
    background: var(--surface);
  }
  .photo-thumb img {
    width: 100%; height: 100%;
    object-fit: cover;
    transition: transform 0.2s;
  }
  .photo-thumb:active img { transform: scale(0.96); }
  .photo-thumb.selected::after {
    content: '✓';
    position: absolute; inset: 0;
    background: rgba(200,169,110,0.5);
    display: flex; align-items: center; justify-content: center;
    font-size: 1.4rem;
    color: white;
  }

  /* ── ALBUMS ── */
  .album-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
  }

  .album-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r);
    overflow: hidden;
    cursor: pointer;
    transition: all 0.15s;
  }
  .album-card:active { transform: scale(0.97); }
  .album-thumb {
    aspect-ratio: 1;
    background: var(--surface2);
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    gap: 1px;
    overflow: hidden;
  }
  .album-thumb img {
    width: 100%; height: 100%; object-fit: cover;
  }
  .album-thumb .placeholder {
    background: var(--border);
    display: flex; align-items: center; justify-content: center;
    font-size: 1.2rem; opacity: 0.3;
  }
  .album-info { padding: 10px 12px; }
  .album-name { font-size: 0.88rem; font-weight: 500; }
  .album-count { font-size: 0.72rem; color: var(--muted); margin-top: 2px; }

  .new-album-card {
    border: 2px dashed var(--border);
    background: transparent;
    border-radius: var(--r);
    aspect-ratio: 1;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    cursor: pointer; gap: 8px;
    transition: all 0.15s;
    color: var(--muted);
    font-size: 0.8rem;
  }
  .new-album-card .plus { font-size: 1.8rem; }
  .new-album-card:active { background: var(--surface); }

  /* ── LIGHTBOX ── */
  #lightbox {
    position: fixed; inset: 0; z-index: 200;
    background: #000;
    display: none;
    flex-direction: column;
  }
  #lightbox.open { display: flex; }

  .lb-header {
    position: absolute; top: 0; left: 0; right: 0; z-index: 10;
    padding: env(safe-area-inset-top, 16px) 16px 16px;
    padding-top: max(env(safe-area-inset-top), 16px);
    display: flex; align-items: center; justify-content: space-between;
    background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
  }
  .lb-close {
    background: rgba(255,255,255,0.12);
    border: none; border-radius: 50%;
    width: 38px; height: 38px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; color: white; font-size: 1.1rem;
  }
  .lb-actions { display: flex; gap: 8px; }
  .lb-btn {
    background: rgba(255,255,255,0.12);
    border: none; border-radius: 20px;
    padding: 8px 14px;
    color: white; cursor: pointer; font-size: 0.8rem;
  }
  .lb-btn.danger { background: rgba(224,85,85,0.3); color: var(--danger); }

  .lb-image-wrap {
    flex: 1;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
    touch-action: pinch-zoom;
  }
  #lb-img {
    max-width: 100%; max-height: 100%;
    object-fit: contain;
    transition: transform 0.05s;
  }

  .lb-footer {
    position: absolute; bottom: 0; left: 0; right: 0;
    padding: 16px;
    padding-bottom: max(env(safe-area-inset-bottom), 16px);
    background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
    text-align: center;
  }
  .lb-date { font-size: 0.75rem; color: rgba(255,255,255,0.4); }
  .lb-name { font-size: 0.82rem; color: rgba(255,255,255,0.6); margin-top: 2px; }

  /* ── MODAL ── */
  .modal-overlay {
    position: fixed; inset: 0; z-index: 300;
    background: rgba(0,0,0,0.7);
    backdrop-filter: blur(8px);
    display: flex; align-items: flex-end;
    justify-content: center;
  }
  .modal-overlay.hidden { display: none; }
  .modal-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 24px 24px 0 0;
    padding: 24px;
    padding-bottom: max(env(safe-area-inset-bottom), 24px);
    width: 100%; max-width: 480px;
    animation: slideUp 0.25s ease;
  }
  @keyframes slideUp {
    from { transform: translateY(100%); }
    to { transform: translateY(0); }
  }
  .modal-title {
    font-family: 'DM Serif Display', serif;
    font-size: 1.2rem;
    color: var(--accent);
    margin-bottom: 16px;
  }
  .modal-input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    color: var(--text);
    font-size: 0.9rem;
    font-family: 'DM Sans', sans-serif;
    margin-bottom: 14px;
    outline: none;
  }
  .modal-input:focus { border-color: var(--accent); }
  .modal-actions { display: flex; gap: 10px; }
  .btn-primary {
    flex: 1;
    background: var(--accent);
    color: #1a1000;
    border: none;
    border-radius: 10px;
    padding: 13px;
    font-size: 0.88rem;
    font-weight: 500;
    cursor: pointer;
    font-family: 'DM Sans', sans-serif;
  }
  .btn-secondary {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--muted);
    border-radius: 10px;
    padding: 13px 20px;
    font-size: 0.88rem;
    cursor: pointer;
    font-family: 'DM Sans', sans-serif;
  }

  /* ── SETTINGS ── */
  .settings-section { margin-bottom: 24px; }
  .settings-label {
    font-size: 0.7rem;
    color: var(--muted);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 8px;
    padding-left: 4px;
  }
  .settings-item {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r);
    padding: 14px 16px;
    display: flex; align-items: center; justify-content: space-between;
    cursor: pointer;
    margin-bottom: 6px;
    transition: all 0.12s;
  }
  .settings-item:active { background: var(--surface2); }
  .settings-item-left { display: flex; align-items: center; gap: 12px; }
  .settings-icon { font-size: 1.1rem; }
  .settings-name { font-size: 0.88rem; }
  .settings-desc { font-size: 0.72rem; color: var(--muted); margin-top: 2px; }
  .settings-arrow { color: var(--muted); font-size: 0.8rem; }

  /* ── TOAST ── */
  #toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 10px 20px;
    font-size: 0.82rem;
    color: var(--text);
    z-index: 999;
    opacity: 0;
    transition: opacity 0.2s;
    white-space: nowrap;
    pointer-events: none;
  }
  #toast.show { opacity: 1; }

  /* ── SELECT MODE ── */
  .select-bar {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: var(--surface);
    border-top: 1px solid var(--border);
    padding: 14px 20px;
    padding-bottom: max(env(safe-area-inset-bottom), 14px);
    display: flex; gap: 10px; align-items: center;
    z-index: 50;
    display: none;
  }
  .select-bar.show { display: flex; }
  .select-count { flex: 1; font-size: 0.82rem; color: var(--muted); }

  /* ── SWIPE HINT ── */
  .swipe-hint {
    text-align: center;
    padding: 8px;
    font-size: 0.7rem;
    color: var(--muted);
    opacity: 0.5;
  }

  /* upload input hidden */
  #file-input { display: none; }
</style>
</head>
<body>

<!-- LOCK SCREEN -->
<div id="lock-screen">
  <div class="lock-logo">Vault</div>
  <div class="lock-tagline">私密相簿</div>

  <div class="pin-dots" id="pin-dots">
    <div class="pin-dot" id="d0"></div>
    <div class="pin-dot" id="d1"></div>
    <div class="pin-dot" id="d2"></div>
    <div class="pin-dot" id="d3"></div>
  </div>

  <div class="numpad">
    <button class="num-btn" onclick="pressPin('1')">1</button>
    <button class="num-btn" onclick="pressPin('2')">2</button>
    <button class="num-btn" onclick="pressPin('3')">3</button>
    <button class="num-btn" onclick="pressPin('4')">4</button>
    <button class="num-btn" onclick="pressPin('5')">5</button>
    <button class="num-btn" onclick="pressPin('6')">6</button>
    <button class="num-btn" onclick="pressPin('7')">7</button>
    <button class="num-btn" onclick="pressPin('8')">8</button>
    <button class="num-btn" onclick="pressPin('9')">9</button>
    <button class="num-btn empty"></button>
    <button class="num-btn" onclick="pressPin('0')">0</button>
    <button class="num-btn del" onclick="deletePin()">⌫</button>
  </div>

  <div class="lock-hint" id="lock-hint">
    輸入 4 位 PIN 碼解鎖<br>
    <span style="opacity:0.5">首次使用：輸入任意 4 位數字設定密碼</span>
  </div>
</div>

<!-- APP -->
<div id="app">
  <div class="app-header">
    <div class="app-title">Vault</div>
    <div class="header-actions">
      <label for="file-input" class="icon-btn">
        ＋ <span>加入</span>
      </label>
      <button class="icon-btn" onclick="toggleSelectMode()">☑</button>
    </div>
  </div>

  <div class="tabs">
    <div class="tab active" onclick="switchTab('photos', this)">所有照片</div>
    <div class="tab" onclick="switchTab('albums', this)">相簿</div>
    <div class="tab" onclick="switchTab('settings', this)">設定</div>
  </div>

  <div class="content" id="content">
    <!-- injected by JS -->
  </div>

  <div class="select-bar" id="select-bar">
    <div class="select-count" id="select-count">已選 0 張</div>
    <button class="btn-secondary" onclick="cancelSelect()">取消</button>
    <button class="btn-primary" onclick="deleteSelected()" style="background:var(--danger);color:white;flex:unset;padding:13px 20px">刪除</button>
  </div>
</div>

<!-- LIGHTBOX -->
<div id="lightbox">
  <div class="lb-header">
    <button class="lb-close" onclick="closeLightbox()">✕</button>
    <div class="lb-actions">
      <button class="lb-btn" onclick="downloadCurrent()">儲存</button>
      <button class="lb-btn danger" onclick="deleteCurrent()">刪除</button>
    </div>
  </div>
  <div class="lb-image-wrap">
    <img id="lb-img" src="" alt="">
  </div>
  <div class="lb-footer">
    <div class="lb-name" id="lb-name"></div>
    <div class="lb-date" id="lb-date"></div>
  </div>
</div>

<!-- MODAL: new album -->
<div class="modal-overlay hidden" id="album-modal">
  <div class="modal-box">
    <div class="modal-title">建立相簿</div>
    <input class="modal-input" id="album-name-input" placeholder="相簿名稱" maxlength="30">
    <div class="modal-actions">
      <button class="btn-secondary" onclick="closeAlbumModal()">取消</button>
      <button class="btn-primary" onclick="createAlbum()">建立</button>
    </div>
  </div>
</div>

<!-- TOAST -->
<div id="toast"></div>

<!-- FILE INPUT -->
<input type="file" id="file-input" multiple accept="image/*" onchange="handleFiles(this.files)">

<script>
// ── STATE ──
let state = {
  photos: [],       // {id, name, data, date, albums:[]}
  albums: [],       // {id, name}
  pin: null,
  currentTab: 'photos',
  currentAlbum: null, // album id or null = all
  selectMode: false,
  selected: new Set(),
  lbIndex: -1,
};

const DB_KEY = 'vault_data_v1';

// ── PERSISTENCE ──
function save() {
  try {
    localStorage.setItem(DB_KEY, JSON.stringify({
      photos: state.photos,
      albums: state.albums,
      pin: state.pin,
    }));
  } catch(e) {
    showToast('儲存空間不足，請刪除部分照片');
  }
}

function load() {
  try {
    const raw = localStorage.getItem(DB_KEY);
    if (!raw) return;
    const d = JSON.parse(raw);
    state.photos = d.photos || [];
    state.albums = d.albums || [];
    state.pin = d.pin || null;
  } catch(e) {}
}

load();

// ── PIN ──
let pinInput = '';

function pressPin(n) {
  if (pinInput.length >= 4) return;
  pinInput += n;
  updateDots();
  if (pinInput.length === 4) {
    setTimeout(checkPin, 80);
  }
}

function deletePin() {
  pinInput = pinInput.slice(0, -1);
  updateDots();
}

function updateDots(error = false) {
  for (let i = 0; i < 4; i++) {
    const d = document.getElementById('d' + i);
    d.className = 'pin-dot';
    if (error) d.classList.add('error');
    else if (i < pinInput.length) d.classList.add('filled');
  }
}

function checkPin() {
  if (!state.pin) {
    // First time — set PIN
    state.pin = pinInput;
    save();
    unlockApp();
    return;
  }
  if (pinInput === state.pin) {
    unlockApp();
  } else {
    updateDots(true);
    document.getElementById('lock-hint').textContent = '密碼錯誤，請重試';
    setTimeout(() => {
      pinInput = '';
      updateDots();
      document.getElementById('lock-hint').innerHTML = '輸入 4 位 PIN 碼解鎖';
    }, 900);
  }
}

function unlockApp() {
  document.getElementById('lock-screen').style.display = 'none';
  const app = document.getElementById('app');
  app.style.display = 'flex';
  renderTab();
}

// ── TABS ──
function switchTab(tab, el) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  state.currentTab = tab;
  state.currentAlbum = null;
  cancelSelect();
  renderTab();
}

function renderTab() {
  const c = document.getElementById('content');
  if (state.currentTab === 'photos') renderPhotos(c);
  else if (state.currentTab === 'albums') renderAlbums(c);
  else renderSettings(c);
}

// ── PHOTOS ──
function renderPhotos(container) {
  let photos = state.photos;
  if (state.currentAlbum) {
    photos = photos.filter(p => p.albums.includes(state.currentAlbum));
  }

  if (photos.length === 0) {
    container.innerHTML = `<div class="empty-state">
      <div class="empty-icon">🔒</div>
      <div class="empty-title">${state.currentAlbum ? '此相簿沒有照片' : '尚無照片'}</div>
      <div class="empty-sub">點擊右上角「＋加入」上傳照片</div>
    </div>`;
    return;
  }

  const grid = document.createElement('div');
  grid.className = 'photo-grid';

  photos.forEach((photo, i) => {
    const div = document.createElement('div');
    div.className = 'photo-thumb';
    if (state.selected.has(photo.id)) div.classList.add('selected');
    const img = document.createElement('img');
    img.src = photo.data;
    img.loading = 'lazy';
    div.appendChild(img);
    div.onclick = () => {
      if (state.selectMode) {
        toggleSelect(photo.id, div);
      } else {
        openLightbox(i, photos);
      }
    };
    div.oncontextmenu = (e) => { e.preventDefault(); if(!state.selectMode) { enterSelectMode(); toggleSelect(photo.id, div); } };
    grid.appendChild(div);
  });

  container.innerHTML = '';
  container.appendChild(grid);
  if (photos.length > 0) {
    const hint = document.createElement('div');
    hint.className = 'swipe-hint';
    hint.textContent = `共 ${photos.length} 張 · 長按進入選擇模式`;
    container.appendChild(hint);
  }
}

// ── ALBUMS ──
function renderAlbums(container) {
  container.innerHTML = '';
  const grid = document.createElement('div');
  grid.className = 'album-grid';

  // New album button
  const newCard = document.createElement('div');
  newCard.className = 'new-album-card';
  newCard.innerHTML = '<div class="plus">＋</div><div>新增相簿</div>';
  newCard.onclick = () => document.getElementById('album-modal').classList.remove('hidden');
  grid.appendChild(newCard);

  state.albums.forEach(album => {
    const photos = state.photos.filter(p => p.albums.includes(album.id));
    const card = document.createElement('div');
    card.className = 'album-card';

    const thumbs = photos.slice(0, 4);
    let thumbHtml = '';
    for (let i = 0; i < 4; i++) {
      if (thumbs[i]) thumbHtml += `<img src="${thumbs[i].data}" loading="lazy">`;
      else thumbHtml += `<div class="placeholder">📷</div>`;
    }

    card.innerHTML = `
      <div class="album-thumb">${thumbHtml}</div>
      <div class="album-info">
        <div class="album-name">${album.name}</div>
        <div class="album-count">${photos.length} 張照片</div>
      </div>`;
    card.onclick = () => openAlbum(album.id, album.name);
    grid.appendChild(card);
  });

  container.appendChild(grid);
}

function openAlbum(id, name) {
  state.currentAlbum = id;
  state.currentTab = 'photos';
  // update header
  document.querySelectorAll('.tab').forEach((t,i) => {
    if(i===0) t.classList.add('active'); else t.classList.remove('active');
  });
  document.querySelector('.app-title').textContent = name;
  const c = document.getElementById('content');
  renderPhotos(c);

  // Add back button
  const header = document.querySelector('.app-header');
  if (!header.querySelector('.back-btn')) {
    const backBtn = document.createElement('button');
    backBtn.className = 'icon-btn back-btn';
    backBtn.innerHTML = '← 返回';
    backBtn.style.marginRight = 'auto';
    backBtn.onclick = () => {
      state.currentAlbum = null;
      document.querySelector('.app-title').textContent = 'Vault';
      backBtn.remove();
      renderTab();
    };
    header.insertBefore(backBtn, header.children[1]);
  }
}

// ── LIGHTBOX ──
let lbPhotos = [];
let lbIdx = 0;
let startX = 0;

function openLightbox(idx, photos) {
  lbPhotos = photos;
  lbIdx = idx;
  showLbPhoto();
  document.getElementById('lightbox').classList.add('open');
}

function showLbPhoto() {
  const p = lbPhotos[lbIdx];
  document.getElementById('lb-img').src = p.data;
  document.getElementById('lb-name').textContent = p.name;
  document.getElementById('lb-date').textContent = new Date(p.date).toLocaleDateString('zh-TW', {year:'numeric',month:'long',day:'numeric',hour:'2-digit',minute:'2-digit'});
}

function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
}

function downloadCurrent() {
  const p = lbPhotos[lbIdx];
  const a = document.createElement('a');
  a.href = p.data;
  a.download = p.name;
  a.click();
  showToast('已儲存到下載資料夾');
}

function deleteCurrent() {
  const p = lbPhotos[lbIdx];
  if (!confirm(`確定刪除「${p.name}」？`)) return;
  state.photos = state.photos.filter(x => x.id !== p.id);
  save();
  lbPhotos = lbPhotos.filter(x => x.id !== p.id);
  if (lbPhotos.length === 0) {
    closeLightbox();
  } else {
    lbIdx = Math.min(lbIdx, lbPhotos.length - 1);
    showLbPhoto();
  }
  renderTab();
  showToast('已刪除');
}

// Swipe lightbox
const lb = document.getElementById('lightbox');
lb.addEventListener('touchstart', e => { startX = e.touches[0].clientX; }, {passive:true});
lb.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - startX;
  if (Math.abs(dx) > 50) {
    if (dx < 0 && lbIdx < lbPhotos.length - 1) { lbIdx++; showLbPhoto(); }
    else if (dx > 0 && lbIdx > 0) { lbIdx--; showLbPhoto(); }
  }
}, {passive:true});

// ── FILES ──
function handleFiles(files) {
  if (!files.length) return;
  let count = 0;
  Array.from(files).forEach(file => {
    const reader = new FileReader();
    reader.onload = e => {
      const photo = {
        id: Date.now() + Math.random(),
        name: file.name,
        data: e.target.result,
        date: Date.now(),
        albums: [],
      };
      state.photos.unshift(photo);
      count++;
      if (count === files.length) {
        save();
        renderTab();
        showToast(`已加入 ${count} 張照片`);
      }
    };
    reader.readAsDataURL(file);
  });
}

// ── SELECT MODE ──
function enterSelectMode() {
  state.selectMode = true;
  document.getElementById('select-bar').classList.add('show');
}

function toggleSelectMode() {
  if (state.selectMode) cancelSelect();
  else { enterSelectMode(); renderTab(); }
}

function toggleSelect(id, el) {
  if (state.selected.has(id)) {
    state.selected.delete(id);
    el.classList.remove('selected');
  } else {
    state.selected.add(id);
    el.classList.add('selected');
  }
  document.getElementById('select-count').textContent = `已選 ${state.selected.size} 張`;
}

function cancelSelect() {
  state.selectMode = false;
  state.selected.clear();
  document.getElementById('select-bar').classList.remove('show');
  if (state.currentTab === 'photos') {
    const c = document.getElementById('content');
    renderPhotos(c);
  }
}

function deleteSelected() {
  if (state.selected.size === 0) return;
  if (!confirm(`確定刪除 ${state.selected.size} 張照片？`)) return;
  state.photos = state.photos.filter(p => !state.selected.has(p.id));
  save();
  cancelSelect();
  renderTab();
  showToast('已刪除選取的照片');
}

// ── ALBUM MODAL ──
function closeAlbumModal() {
  document.getElementById('album-modal').classList.add('hidden');
  document.getElementById('album-name-input').value = '';
}

function createAlbum() {
  const name = document.getElementById('album-name-input').value.trim();
  if (!name) return;
  state.albums.push({ id: Date.now(), name });
  save();
  closeAlbumModal();
  renderAlbums(document.getElementById('content'));
  showToast(`相簿「${name}」已建立`);
}

document.getElementById('album-modal').onclick = function(e) {
  if (e.target === this) closeAlbumModal();
};

function changePin() {
  const newPin = prompt('請輸入新的 4 位 PIN 碼：');
  if (!newPin || !/^\d{4}$/.test(newPin)) {
    showToast('PIN 碼必須為 4 位數字');
    return;
  }
  state.pin = newPin;
  save();
  showToast('PIN 碼已變更');
}

function clearAll() {
  if (!confirm('確定要清除所有照片與相簿？此操作無法復原。')) return;
  state.photos = [];
  state.albums = [];
  save();
  renderTab();
  showToast('已清除所有資料');
}

// ── TOAST ──
let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2400);
}

// ── AUTO LOCK ──
let lockTimer;
function resetLockTimer() {
  clearTimeout(lockTimer);
  lockTimer = setTimeout(() => {
    if (document.getElementById('app').style.display !== 'none') {
      document.getElementById('app').style.display = 'none';
      document.getElementById('lock-screen').style.display = 'flex';
      pinInput = '';
      updateDots();
    }
  }, 5 * 60 * 1000); // 5 分鐘自動鎖定
}

document.addEventListener('touchstart', resetLockTimer, {passive:true});
document.addEventListener('click', resetLockTimer);
resetLockTimer();
