<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0a0f">
<title>DocSafe — 雲端文件保險箱</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap');

  :root {
    --bg: #0a0a0f;
    --surface: #13131a;
    --surface2: #1c1c26;
    --border: #2a2a3a;
    --accent: #c8a96e;
    --accent2: #8b6fd4;
    --text: #e8e4dc;
    --muted: #7a7a90;
    --danger: #e05555;
    --star: #f0c040;
    --r: 14px;
  }

  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100dvh;
    overflow-x: hidden;
    user-select: none;
  }

  /* ══ LOCK SCREEN (偽裝成雲端文件) ══ */
  #lock-screen {
    position: fixed; inset: 0; z-index: 100;
    background: var(--bg);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 40px 24px;
  }
  .lock-logo {
    font-family: 'DM Serif Display', serif;
    font-size: 2rem; color: var(--accent);
    letter-spacing: 0.04em; margin-bottom: 6px;
  }
  .lock-tagline {
    font-size: 0.75rem; color: var(--muted);
    letter-spacing: 0.14em; text-transform: uppercase;
    margin-bottom: 10px;
  }
  .lock-subtitle {
    font-size: 0.72rem; color: var(--muted);
    opacity: 0.55; margin-bottom: 52px;
    text-align: center; line-height: 1.7;
  }
  .pin-dots { display: flex; gap: 16px; margin-bottom: 40px; }
  .pin-dot {
    width: 14px; height: 14px; border-radius: 50%;
    border: 2px solid var(--border); transition: all 0.15s; background: transparent;
  }
  .pin-dot.filled { background: var(--accent); border-color: var(--accent); transform: scale(1.1); }
  .pin-dot.error  { background: var(--danger); border-color: var(--danger); animation: shake 0.35s ease; }

  @keyframes shake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-6px)} 60%{transform:translateX(6px)} }

  .numpad { display: grid; grid-template-columns: repeat(3,1fr); gap: 14px; width: 100%; max-width: 280px; }
  .num-btn {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--r); color: var(--text);
    font-size: 1.5rem; font-family: 'DM Sans', sans-serif; font-weight: 300;
    padding: 18px 0; cursor: pointer; transition: all 0.12s;
  }
  .num-btn:active { background: var(--surface2); transform: scale(0.95); }
  .num-btn.del   { font-size: 1rem; color: var(--muted); }
  .num-btn.empty { background: transparent; border-color: transparent; cursor: default; }
  .lock-hint { margin-top: 28px; font-size: 0.72rem; color: var(--muted); text-align: center; line-height: 1.6; }

  /* ══ APP ══ */
  #app { display: none; flex-direction: column; min-height: 100dvh; }

  .app-header {
    position: sticky; top: 0; z-index: 10;
    background: rgba(10,10,15,0.92);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    padding: 16px 20px 12px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
  }
  .app-title { font-family: 'DM Serif Display', serif; font-size: 1.6rem; color: var(--accent); }
  .header-actions { display: flex; gap: 10px; }

  .icon-btn {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; color: var(--text);
    padding: 8px 12px; cursor: pointer; font-size: 1rem;
    transition: all 0.12s; display: flex; align-items: center; gap: 6px; text-decoration: none;
  }
  .icon-btn:active { background: var(--surface2); }
  .icon-btn span   { font-size: 0.75rem; color: var(--muted); }
  .icon-btn.active-filter { border-color: var(--star); color: var(--star); }

  .tabs { display: flex; padding: 12px 20px 0; gap: 4px; border-bottom: 1px solid var(--border); }
  .tab {
    padding: 8px 16px; border-radius: 10px 10px 0 0;
    cursor: pointer; font-size: 0.82rem; color: var(--muted);
    border: 1px solid transparent; border-bottom: none;
    transition: all 0.15s; position: relative; bottom: -1px;
  }
  .tab.active { color: var(--accent); background: var(--surface); border-color: var(--border); border-bottom-color: var(--surface); }

  /* ══ UPLOAD PROGRESS ══ */
  #upload-progress-bar { background: var(--surface); border-bottom: 1px solid var(--border); padding: 10px 16px 12px; display: none; flex-direction: column; gap: 6px; }
  #upload-progress-bar.visible { display: flex; }
  .upload-status-row { display: flex; align-items: center; justify-content: space-between; }
  .upload-status-label { font-size: 0.78rem; color: var(--accent); display: flex; align-items: center; gap: 6px; }
  .upload-spinner { width: 12px; height: 12px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.7s linear infinite; display: inline-block; flex-shrink: 0; }
  .upload-count-text { font-size: 0.72rem; color: var(--muted); }
  .upload-track { height: 4px; background: var(--border); border-radius: 4px; overflow: hidden; }
  .upload-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2)); border-radius: 4px; transition: width 0.25s ease; width: 0%; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .content { flex: 1; padding: 20px; }

  /* ══ HOME PAGE ══ */
  .home-wrap {
    display: flex; flex-direction: column; gap: 16px;
    padding-top: 8px;
  }
  .home-greeting {
    font-family: 'DM Serif Display', serif;
    font-size: 1.5rem; color: var(--text);
    margin-bottom: 4px;
  }
  .home-sub { font-size: 0.78rem; color: var(--muted); margin-bottom: 8px; }

  .home-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--r); padding: 20px;
    display: flex; align-items: center; gap: 16px;
    cursor: pointer; transition: all 0.15s;
    position: relative; overflow: hidden;
  }
  .home-card::before {
    content: '';
    position: absolute; top: 0; left: 0; bottom: 0; width: 3px;
    background: linear-gradient(to bottom, var(--accent), var(--accent2));
    border-radius: 3px 0 0 3px;
  }
  .home-card:active { background: var(--surface2); transform: scale(0.98); }
  .home-card-icon { font-size: 2rem; flex-shrink: 0; }
  .home-card-body { flex: 1; }
  .home-card-title { font-size: 1rem; font-weight: 500; margin-bottom: 4px; }
  .home-card-desc  { font-size: 0.75rem; color: var(--muted); line-height: 1.5; }
  .home-card-arrow { color: var(--muted); font-size: 1.1rem; flex-shrink: 0; }

  .home-stats {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .stat-box {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--r); padding: 16px;
    display: flex; flex-direction: column; gap: 4px;
  }
  .stat-num { font-family: 'DM Serif Display', serif; font-size: 1.6rem; color: var(--accent); }
  .stat-label { font-size: 0.72rem; color: var(--muted); }

  /* ══ EMPTY STATE ══ */
  .empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 80px 24px; text-align: center; gap: 12px; }
  .empty-icon  { font-size: 3rem; opacity: 0.3; }
  .empty-title { font-size: 1rem; color: var(--muted); }
  .empty-sub   { font-size: 0.78rem; color: var(--muted); opacity: 0.6; }

  /* ══ PHOTO GRID ══ */
  .photo-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 3px; }
  .photo-thumb {
    aspect-ratio: 1; overflow: hidden; position: relative;
    cursor: pointer; border-radius: 4px; background: var(--surface);
  }
  .photo-thumb img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.2s; }
  .photo-thumb:active img { transform: scale(0.96); }
  .photo-thumb.selected::after {
    content: '✓'; position: absolute; inset: 0;
    background: rgba(200,169,110,0.5);
    display: flex; align-items: center; justify-content: center;
    font-size: 1.4rem; color: white;
  }
  /* star badge on thumb */
  .star-badge {
    position: absolute; bottom: 4px; right: 5px;
    font-size: 0.85rem; line-height: 1;
    filter: drop-shadow(0 1px 2px rgba(0,0,0,.7));
    pointer-events: none;
  }

  /* ══ FILTER BAR ══ */
  .filter-bar {
    display: flex; gap: 8px; margin-bottom: 14px;
  }
  .filter-pill {
    padding: 6px 14px; border-radius: 20px; font-size: 0.78rem;
    cursor: pointer; border: 1px solid var(--border);
    background: var(--surface); color: var(--muted); transition: all 0.12s;
  }
  .filter-pill.active { border-color: var(--accent); color: var(--accent); background: rgba(200,169,110,.1); }
  .filter-pill.star-pill.active { border-color: var(--star); color: var(--star); background: rgba(240,192,64,.1); }

  /* ══ LIGHTBOX ══ */
  #lightbox { position: fixed; inset: 0; z-index: 200; background: #000; display: none; flex-direction: column; }
  #lightbox.open { display: flex; }
  .lb-header {
    position: absolute; top: 0; left: 0; right: 0; z-index: 10;
    padding: env(safe-area-inset-top,16px) 16px 16px;
    padding-top: max(env(safe-area-inset-top),16px);
    display: flex; align-items: center; justify-content: space-between;
    background: linear-gradient(to bottom,rgba(0,0,0,.8),transparent);
  }
  .lb-close { background: rgba(255,255,255,.12); border: none; border-radius: 50%; width: 38px; height: 38px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: white; font-size: 1.1rem; }
  .lb-actions { display: flex; gap: 8px; }
  .lb-btn { background: rgba(255,255,255,.12); border: none; border-radius: 20px; padding: 8px 14px; color: white; cursor: pointer; font-size: .8rem; transition: all .12s; }
  .lb-btn.danger  { background: rgba(224,85,85,.3); color: #ff8080; }
  .lb-btn.starred { background: rgba(240,192,64,.35); color: var(--star); }
  .lb-image-wrap { flex: 1; display: flex; align-items: center; justify-content: center; overflow: hidden; touch-action: pinch-zoom; }
  #lb-img { max-width: 100%; max-height: 100%; object-fit: contain; }
  .lb-footer {
    position: absolute; bottom: 0; left: 0; right: 0;
    padding: 16px; padding-bottom: max(env(safe-area-inset-bottom),16px);
    background: linear-gradient(to top,rgba(0,0,0,.8),transparent);
    text-align: center;
  }
  .lb-date { font-size: .75rem; color: rgba(255,255,255,.4); }
  .lb-name { font-size: .82rem; color: rgba(255,255,255,.6); margin-top: 2px; }

  /* ══ SETTINGS ══ */
  .settings-section { margin-bottom: 24px; }
  .settings-label { font-size: .7rem; color: var(--muted); letter-spacing: .1em; text-transform: uppercase; margin-bottom: 8px; padding-left: 4px; }
  .settings-item { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; cursor: pointer; margin-bottom: 6px; transition: all .12s; }
  .settings-item:active { background: var(--surface2); }
  .settings-item-left { display: flex; align-items: center; gap: 12px; }
  .settings-icon { font-size: 1.1rem; }
  .settings-name { font-size: .88rem; }
  .settings-desc { font-size: .72rem; color: var(--muted); margin-top: 2px; }
  .settings-arrow { color: var(--muted); font-size: .8rem; }

  /* ══ TOAST ══ */
  #toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 10px 20px; font-size: .82rem; color: var(--text); z-index: 999; opacity: 0; transition: opacity .2s; white-space: nowrap; pointer-events: none; }
  #toast.show { opacity: 1; }

  /* ══ SELECT BAR ══ */
  .select-bar { position: fixed; bottom: 0; left: 0; right: 0; background: var(--surface); border-top: 1px solid var(--border); padding: 14px 20px; padding-bottom: max(env(safe-area-inset-bottom),14px); display: none; gap: 10px; align-items: center; z-index: 50; }
  .select-bar.show { display: flex; }
  .select-count { flex: 1; font-size: .82rem; color: var(--muted); }

  .swipe-hint { text-align: center; padding: 8px; font-size: .7rem; color: var(--muted); opacity: .5; }
  #file-input { display: none; }
</style>
</head>
<body>

<!-- ══ LOCK SCREEN (偽裝) ══ -->
<div id="lock-screen">
  <div class="lock-logo">DocSafe</div>
  <div class="lock-tagline">雲端文件保險箱</div>
  <div class="lock-subtitle">
    安全儲存您的重要文件與合約<br>
    支援 PDF、Word、試算表格式
  </div>
  <div class="pin-dots" id="pin-dots">
    <div class="pin-dot" id="d0"></div>
    <div class="pin-dot" id="d1"></div>
    <div class="pin-dot" id="d2"></div>
    <div class="pin-dot" id="d3"></div>
  </div>
  <div class="numpad">
    <button class="num-btn" onclick="pressPin('1')">1</button>
    <button class="num-btn" onclick="pressPin('2')">2</button>
    <button class="num-btn" onclick="pressPin('3')">3</button>
    <button class="num-btn" onclick="pressPin('4')">4</button>
    <button class="num-btn" onclick="pressPin('5')">5</button>
    <button class="num-btn" onclick="pressPin('6')">6</button>
    <button class="num-btn" onclick="pressPin('7')">7</button>
    <button class="num-btn" onclick="pressPin('8')">8</button>
    <button class="num-btn" onclick="pressPin('9')">9</button>
    <button class="num-btn empty"></button>
    <button class="num-btn" onclick="pressPin('0')">0</button>
    <button class="num-btn del" onclick="deletePin()">⌫</button>
  </div>
  <div class="lock-hint" id="lock-hint">
    輸入存取密碼<br>
    <span style="opacity:.45">首次使用：設定任意 4 位數字密碼</span>
  </div>
</div>

<!-- ══ APP ══ -->
<div id="app">
  <div class="app-header">
    <div class="app-title" id="app-title">DocSafe</div>
    <div class="header-actions" id="header-actions">
      <!-- 由 JS 動態填入 -->
    </div>
  </div>
  <div class="tabs" id="tabs">
    <div class="tab active" data-tab="home"  onclick="switchTab('home',this)">首頁</div>
    <div class="tab"        data-tab="photos" onclick="switchTab('photos',this)">相片庫</div>
    <div class="tab"        data-tab="settings" onclick="switchTab('settings',this)">設定</div>
  </div>
  <div id="upload-progress-bar">
    <div class="upload-status-row">
      <div class="upload-status-label">
        <span class="upload-spinner" id="upload-spinner"></span>
        <span id="upload-status-text">正在儲存...</span>
      </div>
      <div class="upload-count-text" id="upload-count-text"></div>
    </div>
    <div class="upload-track"><div class="upload-fill" id="upload-fill"></div></div>
  </div>
  <div class="content" id="content"></div>
  <div class="select-bar" id="select-bar">
    <div class="select-count" id="select-count">已選 0 張</div>
    <button onclick="starSelected()" style="background:rgba(240,192,64,.15);border:1px solid var(--star);color:var(--star);border-radius:10px;padding:12px 16px;font-size:.88rem;cursor:pointer;font-family:inherit;">★ 加星</button>
    <button onclick="cancelSelect()" style="background:var(--surface2);border:1px solid var(--border);color:var(--muted);border-radius:10px;padding:12px 16px;font-size:.88rem;cursor:pointer;font-family:inherit;">取消</button>
    <button onclick="deleteSelected()" style="background:var(--danger);color:white;border:none;border-radius:10px;padding:12px 16px;font-size:.88rem;cursor:pointer;font-family:inherit;">刪除</button>
  </div>
</div>

<!-- ══ LIGHTBOX ══ -->
<div id="lightbox">
  <div class="lb-header">
    <button class="lb-close" onclick="closeLightbox()">✕</button>
    <div class="lb-actions">
      <button class="lb-btn" id="lb-star-btn" onclick="toggleStarCurrent()">☆ 加星</button>
      <button class="lb-btn" onclick="downloadCurrent()">儲存</button>
      <button class="lb-btn danger" onclick="deleteCurrent()">刪除</button>
    </div>
  </div>
  <div class="lb-image-wrap"><img id="lb-img" src="" alt=""></div>
  <div class="lb-footer">
    <div class="lb-name" id="lb-name"></div>
    <div class="lb-date" id="lb-date"></div>
  </div>
</div>

<div id="toast"></div>
<input type="file" id="file-input" multiple accept="image/*" onchange="handleFiles(this.files)">

<script>
// ════════════════════════════════
//  IndexedDB  (v2 — 新增 starred)
// ════════════════════════════════
const IDB_NAME = 'vault_db';
const IDB_VER  = 2;          // 升版以新增 starred index
const STORE    = 'photos';
let db = null;

function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(IDB_NAME, IDB_VER);
    req.onupgradeneeded = e => {
      const d = e.target.result;
      const tx = e.target.transaction;
      let store;
      if (!d.objectStoreNames.contains(STORE)) {
        store = d.createObjectStore(STORE, { keyPath: 'id' });
        store.createIndex('date','date');
      } else {
        store = tx.objectStore(STORE);
        // 升版時把舊資料的 starred 補成 0
        store.openCursor().onsuccess = ev => {
          const cursor = ev.target.result;
          if (!cursor) return;
          if (cursor.value.starred === undefined) {
            const rec = cursor.value;
            rec.starred = 0;
            cursor.update(rec);
          }
          cursor.continue();
        };
      }
    };
    req.onsuccess = e => { db = e.target.result; resolve(); };
    req.onerror   = e => reject(e.target.error);
  });
}

function idbPut(rec) {
  // 確保 starred 一定是數字
  if (rec.starred === undefined) rec.starred = 0;
  return new Promise((res,rej)=>{
    const t = db.transaction(STORE,'readwrite');
    t.objectStore(STORE).put(rec);
    t.oncomplete=res; t.onerror=e=>rej(e.target.error);
  });
}
function idbDel(id) {
  return new Promise((res,rej)=>{
    const t = db.transaction(STORE,'readwrite');
    t.objectStore(STORE).delete(id);
    t.oncomplete=res; t.onerror=e=>rej(e.target.error);
  });
}
// 用 getAll() 取全部再 JS 排序，避免 index 問題
function idbAll() {
  return new Promise((res,rej)=>{
    const req = db.transaction(STORE,'readonly').objectStore(STORE).getAll();
    req.onsuccess = e => {
      const rows = e.target.result.map(r => ({ ...r, starred: r.starred||0 }));
      rows.sort((a,b) => (b.date||0) - (a.date||0));
      res(rows);
    };
    req.onerror = e => rej(e.target.error);
  });
}
function idbCount() {
  return new Promise((res,rej)=>{
    const req = db.transaction(STORE,'readonly').objectStore(STORE).count();
    req.onsuccess=e=>res(e.target.result); req.onerror=e=>rej(e.target.error);
  });
}
// 直接從全量資料算，不依賴 index
async function idbCountStarred() {
  const all = await idbAll();
  return all.filter(r => r.starred === 1).length;
}
function idbClear() {
  return new Promise((res,rej)=>{
    const t = db.transaction(STORE,'readwrite');
    t.objectStore(STORE).clear();
    t.oncomplete=res; t.onerror=e=>rej(e.target.error);
  });
}

// ════════════════════════════════
//  PIN
// ════════════════════════════════
const PIN_KEY = 'vault_pin_v2';
let vaultPin = localStorage.getItem(PIN_KEY);
let pinInput = '';

function pressPin(n) {
  if (pinInput.length>=4) return;
  pinInput+=n; updateDots();
  if (pinInput.length===4) setTimeout(checkPin,80);
}
function deletePin() { pinInput=pinInput.slice(0,-1); updateDots(); }
function updateDots(error=false) {
  for(let i=0;i<4;i++){
    const d=document.getElementById('d'+i);
    d.className='pin-dot';
    if(error) d.classList.add('error');
    else if(i<pinInput.length) d.classList.add('filled');
  }
}
function checkPin() {
  if(!vaultPin){ vaultPin=pinInput; localStorage.setItem(PIN_KEY,vaultPin); unlockApp(); return; }
  if(pinInput===vaultPin){ unlockApp(); }
  else{
    updateDots(true);
    document.getElementById('lock-hint').textContent='密碼錯誤，請重試';
    setTimeout(()=>{ pinInput=''; updateDots(); document.getElementById('lock-hint').innerHTML='輸入存取密碼'; },900);
  }
}
async function unlockApp() {
  document.getElementById('lock-screen').style.display='none';
  document.getElementById('app').style.display='flex';
  state.currentTab='home';
  await renderTab();
}

// ════════════════════════════════
//  STATE
// ════════════════════════════════
let state = {
  currentTab: 'home',
  starFilter: false,   // true = only starred
  selectMode: false,
  selected: new Set(),
};
let photoMeta = [];

// ════════════════════════════════
//  TABS & HEADER
// ════════════════════════════════
function switchTab(tab, el) {
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  state.currentTab = tab;
  state.starFilter = false;
  cancelSelect();
  updateHeader();
  renderTab();
}

function updateHeader() {
  const actions = document.getElementById('header-actions');
  if (state.currentTab==='photos') {
    actions.innerHTML = `
      <button class="icon-btn${state.starFilter?' active-filter':''}" id="star-filter-btn" onclick="toggleStarFilter()" title="只看星號">★</button>
      <label for="file-input" class="icon-btn">＋ <span>加入</span></label>
      <button class="icon-btn" onclick="toggleSelectMode()">☑</button>`;
  } else {
    actions.innerHTML = '';
  }
}

async function renderTab() {
  const c = document.getElementById('content');
  updateHeader();
  if      (state.currentTab==='home')     await renderHome(c);
  else if (state.currentTab==='photos')   await renderPhotos(c);
  else                                    await renderSettings(c);
}

// ════════════════════════════════
//  HOME
// ════════════════════════════════
async function renderHome(container) {
  let total = 0, starred = 0;
  try {
    total   = await idbCount();
    starred = await idbCountStarred();
  } catch(err) {
    container.innerHTML = `<div class="empty-state"><div class="empty-icon">⚠️</div><div class="empty-title">載入失敗</div><div class="empty-sub">${err.message||err}</div></div>`;
    return;
  }

  container.innerHTML = '';
  const wrap = document.createElement('div');
  wrap.className = 'home-wrap';

  wrap.innerHTML = `
    <div>
      <div class="home-greeting">歡迎回來</div>
      <div class="home-sub">您的私密空間已解鎖</div>
    </div>
    <div class="home-stats">
      <div class="stat-box">
        <div class="stat-num">${total}</div>
        <div class="stat-label">已儲存</div>
      </div>
      <div class="stat-box">
        <div class="stat-num" style="color:var(--star)">${starred}</div>
        <div class="stat-label">已加星號</div>
      </div>
    </div>
    <div class="home-card" onclick="goPhotos()">
      <div class="home-card-icon">🖼️</div>
      <div class="home-card-body">
        <div class="home-card-title">所有照片</div>
        <div class="home-card-desc">瀏覽、管理全部 ${total} 張照片</div>
      </div>
      <div class="home-card-arrow">›</div>
    </div>
    <div class="home-card" onclick="goPhotosStarred()">
      <div class="home-card-icon">⭐</div>
      <div class="home-card-body">
        <div class="home-card-title">星號照片</div>
        <div class="home-card-desc">快速檢視 ${starred} 張加星號的照片</div>
      </div>
      <div class="home-card-arrow">›</div>
    </div>`;

  container.appendChild(wrap);
}

function goPhotos() {
  state.starFilter = false;
  activateTab('photos');
}
function goPhotosStarred() {
  state.starFilter = true;
  activateTab('photos');
}
function activateTab(tab) {
  state.currentTab = tab;
  document.querySelectorAll('.tab').forEach(t => {
    t.classList.toggle('active', t.dataset.tab===tab);
  });
  updateHeader();
  renderTab();
}

// ════════════════════════════════
//  STAR FILTER
// ════════════════════════════════
function toggleStarFilter() {
  state.starFilter = !state.starFilter;
  updateHeader();
  renderPhotos(document.getElementById('content'));
}

// ════════════════════════════════
//  PHOTOS
// ════════════════════════════════
async function renderPhotos(container) {
  container.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;padding:60px 0;color:var(--muted);font-size:.82rem;opacity:.5">載入中...</div>';
  let all = [];
  try {
    all = await idbAll();
  } catch(err) {
    container.innerHTML = `<div class="empty-state"><div class="empty-icon">⚠️</div><div class="empty-title">載入失敗</div><div class="empty-sub">${err.message||err}</div></div>`;
    return;
  }
  photoMeta = state.starFilter ? all.filter(p=>p.starred===1) : all;

  const filterBar = document.createElement('div');
  filterBar.className='filter-bar';
  filterBar.innerHTML=`
    <div class="filter-pill${!state.starFilter?' active':''}" onclick="state.starFilter=false;updateHeader();renderPhotos(document.getElementById('content'))">全部</div>
    <div class="filter-pill star-pill${state.starFilter?' active':''}" onclick="state.starFilter=true;updateHeader();renderPhotos(document.getElementById('content'))">⭐ 星號</div>`;

  if (!photoMeta.length) {
    container.innerHTML='';
    container.appendChild(filterBar);
    container.innerHTML += `<div class="empty-state"><div class="empty-icon">${state.starFilter?'⭐':'🔒'}</div><div class="empty-title">${state.starFilter?'沒有星號照片':'尚無照片'}</div><div class="empty-sub">${state.starFilter?'在照片上點擊加星號按鈕':'點擊右上角「＋加入」上傳照片'}</div></div>`;
    return;
  }

  const grid = document.createElement('div');
  grid.className='photo-grid';

  photoMeta.forEach((photo,i)=>{
    const div=document.createElement('div');
    div.className='photo-thumb';
    if(state.selected.has(photo.id)) div.classList.add('selected');

    const img=document.createElement('img');
    img.loading='lazy';
    const url=URL.createObjectURL(photo.blob);
    img.src=url;
    img.onload=()=>URL.revokeObjectURL(url);
    div.appendChild(img);

    if(photo.starred===1){
      const badge=document.createElement('div');
      badge.className='star-badge';
      badge.textContent='★';
      badge.style.color='var(--star)';
      div.appendChild(badge);
    }

    div.onclick=()=>{ if(state.selectMode) toggleSelect(photo.id,div); else openLightbox(i); };
    div.oncontextmenu=e=>{ e.preventDefault(); if(!state.selectMode){enterSelectMode();toggleSelect(photo.id,div);} };
    grid.appendChild(div);
  });

  container.innerHTML='';
  container.appendChild(filterBar);
  container.appendChild(grid);
  const hint=document.createElement('div');
  hint.className='swipe-hint';
  hint.textContent=`共 ${photoMeta.length} 張 · 長按進入選擇模式`;
  container.appendChild(hint);
}

// ════════════════════════════════
//  LIGHTBOX
// ════════════════════════════════
let lbIdx=0, startX=0;

async function openLightbox(idx){
  lbIdx=idx; await showLbPhoto();
  document.getElementById('lightbox').classList.add('open');
}
async function showLbPhoto(){
  const m=photoMeta[lbIdx];
  const img=document.getElementById('lb-img');
  if(img._blobUrl) URL.revokeObjectURL(img._blobUrl);
  img._blobUrl=URL.createObjectURL(m.blob);
  img.src=img._blobUrl;
  document.getElementById('lb-name').textContent=m.name;
  document.getElementById('lb-date').textContent=new Date(m.date).toLocaleDateString('zh-TW',{year:'numeric',month:'long',day:'numeric',hour:'2-digit',minute:'2-digit'});
  // update star button
  const btn=document.getElementById('lb-star-btn');
  if(m.starred===1){ btn.textContent='★ 已加星'; btn.classList.add('starred'); }
  else             { btn.textContent='☆ 加星';   btn.classList.remove('starred'); }
}
function closeLightbox(){
  document.getElementById('lightbox').classList.remove('open');
  const img=document.getElementById('lb-img');
  if(img._blobUrl){ URL.revokeObjectURL(img._blobUrl); img._blobUrl=null; }
}
async function downloadCurrent(){
  const m=photoMeta[lbIdx];
  const url=URL.createObjectURL(m.blob);
  const a=document.createElement('a'); a.href=url; a.download=m.name; a.click();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
  showToast('已儲存到下載資料夾');
}
async function deleteCurrent(){
  const m=photoMeta[lbIdx];
  if(!confirm(`確定刪除「${m.name}」？`)) return;
  await idbDel(m.id);
  closeLightbox();
  await renderTab();
  showToast('已刪除');
}
async function toggleStarCurrent(){
  const m=photoMeta[lbIdx];
  m.starred = (m.starred===1) ? 0 : 1;
  await idbPut(m);
  await showLbPhoto();
  // refresh thumb badge without full reload
  const thumbs=document.querySelectorAll('.photo-thumb');
  if(thumbs[lbIdx]){
    const old=thumbs[lbIdx].querySelector('.star-badge');
    if(old) old.remove();
    if(m.starred===1){
      const badge=document.createElement('div');
      badge.className='star-badge'; badge.textContent='★';
      badge.style.color='var(--star)';
      thumbs[lbIdx].appendChild(badge);
    }
  }
  showToast(m.starred===1 ? '已加星號 ★' : '已取消星號');
}

// swipe
const lb=document.getElementById('lightbox');
lb.addEventListener('touchstart',e=>{startX=e.touches[0].clientX;},{passive:true});
lb.addEventListener('touchend',async e=>{
  const dx=e.changedTouches[0].clientX-startX;
  if(Math.abs(dx)>50){
    if(dx<0&&lbIdx<photoMeta.length-1){lbIdx++;await showLbPhoto();}
    else if(dx>0&&lbIdx>0){lbIdx--;await showLbPhoto();}
  }
},{passive:true});

// ════════════════════════════════
//  UPLOAD PROGRESS
// ════════════════════════════════
let upTimer=null;
function showUploadProgress(done,total){
  const bar=document.getElementById('upload-progress-bar');
  const fill=document.getElementById('upload-fill');
  const spin=document.getElementById('upload-spinner');
  const stxt=document.getElementById('upload-status-text');
  const ctxt=document.getElementById('upload-count-text');
  bar.classList.add('visible');
  fill.style.width=(total>0?Math.round(done/total*100):0)+'%';
  ctxt.textContent=`${done} / ${total} 張`;
  if(done<total){
    spin.style.display='inline-block';
    stxt.textContent='正在儲存...';
    stxt.parentElement.style.color='var(--accent)';
  }else{
    spin.style.display='none';
    stxt.textContent=`✅ 已完成，加入 ${total} 張`;
    stxt.parentElement.style.color='#6dbf7e';
    clearTimeout(upTimer);
    upTimer=setTimeout(()=>{bar.classList.remove('visible');fill.style.width='0%';},2500);
  }
}

// ════════════════════════════════
//  FILES
// ════════════════════════════════
async function handleFiles(files){
  if(!files.length) return;
  const total=files.length; let done=0;
  showUploadProgress(0,total);
  for(const file of Array.from(files)){
    await idbPut({id:Date.now()+Math.random(), name:file.name, date:Date.now(), blob:file, starred:0});
    done++; showUploadProgress(done,total);
  }
  document.getElementById('file-input').value='';
  await renderTab();
}

// ════════════════════════════════
//  SELECT MODE
// ════════════════════════════════
function enterSelectMode(){ state.selectMode=true; document.getElementById('select-bar').classList.add('show'); }
function toggleSelectMode(){ if(state.selectMode) cancelSelect(); else{enterSelectMode();renderTab();} }
function toggleSelect(id,el){
  if(state.selected.has(id)){state.selected.delete(id);el.classList.remove('selected');}
  else{state.selected.add(id);el.classList.add('selected');}
  document.getElementById('select-count').textContent=`已選 ${state.selected.size} 張`;
}
function cancelSelect(){
  state.selectMode=false; state.selected.clear();
  document.getElementById('select-bar').classList.remove('show');
  if(state.currentTab==='photos') renderTab();
}
async function deleteSelected(){
  if(!state.selected.size) return;
  if(!confirm(`確定刪除 ${state.selected.size} 張照片？`)) return;
  for(const id of state.selected) await idbDel(id);
  cancelSelect(); await renderTab(); showToast('已刪除選取的照片');
}
async function starSelected(){
  if(!state.selected.size) return;
  const all=await idbAll();
  for(const id of state.selected){
    const p=all.find(x=>x.id===id);
    if(p){ p.starred=1; await idbPut(p); }
  }
  cancelSelect(); await renderTab(); showToast(`已為 ${state.selected.size||'選取'} 張照片加星號 ★`);
}

// ════════════════════════════════
//  SETTINGS
// ════════════════════════════════
async function renderSettings(container){
  const count=await idbCount();
  const starred=await idbCountStarred();
  container.innerHTML=`
    <div class="settings-section">
      <div class="settings-label">安全性</div>
      <div class="settings-item" onclick="changePin()">
        <div class="settings-item-left"><div class="settings-icon">🔐</div><div><div class="settings-name">變更密碼</div><div class="settings-desc">修改 4 位數存取密碼</div></div></div>
        <div class="settings-arrow">›</div>
      </div>
    </div>
    <div class="settings-section">
      <div class="settings-label">儲存</div>
      <div class="settings-item">
        <div class="settings-item-left"><div class="settings-icon">📦</div><div><div class="settings-name">照片總數</div><div class="settings-desc">${count} 張（${starred} 張加星號）· 存於裝置 IndexedDB</div></div></div>
      </div>
      <div class="settings-item" onclick="clearAll()" style="border-color:rgba(224,85,85,.3)">
        <div class="settings-item-left"><div class="settings-icon">🗑️</div><div><div class="settings-name" style="color:var(--danger)">清除所有資料</div><div class="settings-desc">刪除全部照片，無法復原</div></div></div>
      </div>
    </div>
    <div class="settings-section">
      <div class="settings-label">關於</div>
      <div class="settings-item">
        <div class="settings-item-left"><div class="settings-icon">🔒</div><div><div class="settings-name">隱私保護</div><div class="settings-desc">所有照片僅存於本機，不上傳伺服器<br>不會出現在系統相簿中</div></div></div>
      </div>
    </div>
    <div class="settings-section">
      <div class="settings-label">使用提示</div>
      <div class="settings-item">
        <div class="settings-item-left" style="flex-direction:column;align-items:flex-start;gap:6px">
          <div class="settings-desc" style="color:var(--text);opacity:.8">📱 加入主畫面</div>
          <div class="settings-desc">iOS：Safari → 分享 → 加入主畫面<br>Android：Chrome → 選單 → 新增至主畫面</div>
        </div>
      </div>
    </div>`;
}

function changePin(){
  const p=prompt('請輸入新的 4 位密碼：');
  if(!p||!/^\d{4}$/.test(p)){showToast('密碼必須為 4 位數字');return;}
  vaultPin=p; localStorage.setItem(PIN_KEY,p); showToast('密碼已變更');
}
async function clearAll(){
  if(!confirm('確定要清除所有照片？此操作無法復原。')) return;
  await idbClear(); await renderTab(); showToast('已清除所有資料');
}

// ════════════════════════════════
//  TOAST
// ════════════════════════════════
let toastTimer;
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('show'),2400);
}

// ════════════════════════════════
//  AUTO LOCK
// ════════════════════════════════
let lockTimer;
function resetLockTimer(){
  clearTimeout(lockTimer);
  lockTimer=setTimeout(()=>{
    if(document.getElementById('app').style.display!=='none'){
      document.getElementById('app').style.display='none';
      document.getElementById('lock-screen').style.display='flex';
      pinInput=''; updateDots();
    }
  },5*60*1000);
}
document.addEventListener('touchstart',resetLockTimer,{passive:true});
document.addEventListener('click',resetLockTimer);
resetLockTimer();

// ════════════════════════════════
//  INIT
// ════════════════════════════════
openDB().catch(()=>showToast('無法開啟資料庫，請重新整理'));
</script>
