<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0a0f">
<title>DocSafe — 雲端文件保險箱</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap');
:root{
  --bg:#0a0a0f;--surface:#13131a;--surface2:#1c1c26;--border:#2a2a3a;
  --accent:#c8a96e;--accent2:#8b6fd4;--text:#e8e4dc;--muted:#7a7a90;
  --danger:#e05555;--star:#f0c040;--r:14px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100dvh;overflow-x:hidden;user-select:none;}

/* ── LOCK ── */
#lock-screen{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 24px;}
.lock-logo{font-family:'DM Serif Display',serif;font-size:2rem;color:var(--accent);letter-spacing:.04em;margin-bottom:6px;}
.lock-tagline{font-size:.75rem;color:var(--muted);letter-spacing:.14em;text-transform:uppercase;margin-bottom:10px;}
.lock-subtitle{font-size:.72rem;color:var(--muted);opacity:.55;margin-bottom:52px;text-align:center;line-height:1.7;}
.pin-dots{display:flex;gap:16px;margin-bottom:40px;}
.pin-dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--border);transition:all .15s;background:transparent;}
.pin-dot.filled{background:var(--accent);border-color:var(--accent);transform:scale(1.1);}
.pin-dot.error{background:var(--danger);border-color:var(--danger);animation:shake .35s ease;}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}60%{transform:translateX(6px)}}
.numpad{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;width:100%;max-width:280px;}
.num-btn{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);color:var(--text);font-size:1.5rem;font-family:'DM Sans',sans-serif;font-weight:300;padding:18px 0;cursor:pointer;transition:all .12s;}
.num-btn:active{background:var(--surface2);transform:scale(.95);}
.num-btn.del{font-size:1rem;color:var(--muted);}
.num-btn.empty{background:transparent;border-color:transparent;cursor:default;}
.lock-hint{margin-top:28px;font-size:.72rem;color:var(--muted);text-align:center;line-height:1.6;}

/* ── APP ── */
#app{display:none;flex-direction:column;min-height:100dvh;}
.app-header{position:sticky;top:0;z-index:10;background:rgba(10,10,15,.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);padding:16px 20px 12px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:10px;}
.app-title{font-family:'DM Serif Display',serif;font-size:1.5rem;color:var(--accent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;}
.header-actions{display:flex;gap:8px;flex-shrink:0;}
.icon-btn{background:var(--surface);border:1px solid var(--border);border-radius:10px;color:var(--text);padding:8px 12px;cursor:pointer;font-size:.95rem;transition:all .12s;display:flex;align-items:center;gap:5px;text-decoration:none;white-space:nowrap;}
.icon-btn:active{background:var(--surface2);}
.icon-btn span{font-size:.72rem;color:var(--muted);}
.icon-btn.star-active{border-color:var(--star);color:var(--star);}
.icon-btn.back-btn{color:var(--muted);font-size:.82rem;padding:8px 10px;}

/* ── TABS ── */
.tabs{display:flex;padding:12px 20px 0;gap:4px;border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none;}
.tabs::-webkit-scrollbar{display:none;}
.tab{padding:8px 14px;border-radius:10px 10px 0 0;cursor:pointer;font-size:.8rem;color:var(--muted);border:1px solid transparent;border-bottom:none;transition:all .15s;position:relative;bottom:-1px;white-space:nowrap;}
.tab.active{color:var(--accent);background:var(--surface);border-color:var(--border);border-bottom-color:var(--surface);}

/* ── PROGRESS ── */
#upload-progress-bar{background:var(--surface);border-bottom:1px solid var(--border);padding:10px 16px 12px;display:none;flex-direction:column;gap:6px;}
#upload-progress-bar.visible{display:flex;}
.up-row{display:flex;align-items:center;justify-content:space-between;}
.up-label{font-size:.78rem;color:var(--accent);display:flex;align-items:center;gap:6px;}
.up-spinner{width:12px;height:12px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;display:inline-block;flex-shrink:0;}
.up-count{font-size:.72rem;color:var(--muted);}
.up-track{height:4px;background:var(--border);border-radius:4px;overflow:hidden;}
.up-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:4px;transition:width .25s ease;width:0%;}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── CONTENT ── */
.content{flex:1;padding:20px;}

/* ── HOME ── */
.home-wrap{display:flex;flex-direction:column;gap:14px;padding-top:4px;}
.home-greeting{font-family:'DM Serif Display',serif;font-size:1.4rem;color:var(--text);margin-bottom:2px;}
.home-sub{font-size:.75rem;color:var(--muted);}
.home-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.stat-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px 12px;display:flex;flex-direction:column;gap:3px;}
.stat-num{font-family:'DM Serif Display',serif;font-size:1.4rem;color:var(--accent);}
.stat-label{font-size:.68rem;color:var(--muted);}
.home-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:18px;display:flex;align-items:center;gap:14px;cursor:pointer;transition:all .15s;position:relative;overflow:hidden;}
.home-card::before{content:'';position:absolute;top:0;left:0;bottom:0;width:3px;background:linear-gradient(to bottom,var(--accent),var(--accent2));border-radius:3px 0 0 3px;}
.home-card:active{background:var(--surface2);transform:scale(.98);}
.home-card-icon{font-size:1.8rem;flex-shrink:0;}
.home-card-body{flex:1;}
.home-card-title{font-size:.95rem;font-weight:500;margin-bottom:3px;}
.home-card-desc{font-size:.72rem;color:var(--muted);line-height:1.5;}
.home-card-arrow{color:var(--muted);font-size:1.1rem;flex-shrink:0;}

/* ── ALBUMS ── */
.album-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;}
.album-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;cursor:pointer;transition:all .15s;position:relative;}
.album-card:active{transform:scale(.97);}
.album-cover{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;aspect-ratio:1;background:var(--surface2);}
.album-cover img{width:100%;height:100%;object-fit:cover;}
.album-cover .ac-empty{background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:1.2rem;opacity:.2;}
.album-info{padding:10px 12px;}
.album-name{font-size:.88rem;font-weight:500;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.album-meta{font-size:.7rem;color:var(--muted);}
.album-new-card{background:var(--surface);border:2px dashed var(--border);border-radius:var(--r);aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;cursor:pointer;transition:all .15s;color:var(--muted);}
.album-new-card:active{background:var(--surface2);}
.album-new-icon{font-size:1.8rem;opacity:.4;}
.album-new-label{font-size:.78rem;}
.album-delete-btn{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.6);border:none;border-radius:50%;width:28px;height:28px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#fff;font-size:.75rem;opacity:0;transition:opacity .15s;}
.album-card:hover .album-delete-btn,.album-card:active .album-delete-btn{opacity:1;}

/* ── PHOTOS ── */
.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;}
.photo-thumb{aspect-ratio:1;overflow:hidden;position:relative;cursor:pointer;border-radius:4px;background:var(--surface);}
.photo-thumb img{width:100%;height:100%;object-fit:cover;transition:transform .2s;}
.photo-thumb:active img{transform:scale(.96);}
.photo-thumb.selected::after{content:'✓';position:absolute;inset:0;background:rgba(200,169,110,.5);display:flex;align-items:center;justify-content:center;font-size:1.4rem;color:white;}
.star-badge{position:absolute;bottom:4px;right:5px;font-size:.85rem;line-height:1;filter:drop-shadow(0 1px 2px rgba(0,0,0,.7));pointer-events:none;color:var(--star);}
.filter-bar{display:flex;gap:8px;margin-bottom:14px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;}
.filter-bar::-webkit-scrollbar{display:none;}
.filter-pill{padding:6px 14px;border-radius:20px;font-size:.76rem;cursor:pointer;border:1px solid var(--border);background:var(--surface);color:var(--muted);transition:all .12s;white-space:nowrap;flex-shrink:0;}
.filter-pill.active{border-color:var(--accent);color:var(--accent);background:rgba(200,169,110,.1);}
.filter-pill.star-active{border-color:var(--star);color:var(--star);background:rgba(240,192,64,.1);}

/* ── EMPTY ── */
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:70px 24px;text-align:center;gap:10px;}
.empty-icon{font-size:2.8rem;opacity:.3;}
.empty-title{font-size:.95rem;color:var(--muted);}
.empty-sub{font-size:.75rem;color:var(--muted);opacity:.6;}

/* ── LIGHTBOX ── */
#lightbox{position:fixed;inset:0;z-index:200;background:#000;display:none;flex-direction:column;}
#lightbox.open{display:flex;}
.lb-header{position:absolute;top:0;left:0;right:0;z-index:10;padding:env(safe-area-inset-top,16px) 14px 16px;padding-top:max(env(safe-area-inset-top),16px);display:flex;align-items:center;justify-content:space-between;background:linear-gradient(to bottom,rgba(0,0,0,.8),transparent);}
.lb-close{background:rgba(255,255,255,.12);border:none;border-radius:50%;width:36px;height:36px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:white;font-size:1rem;}
.lb-actions{display:flex;gap:6px;}
.lb-btn{background:rgba(255,255,255,.12);border:none;border-radius:20px;padding:7px 12px;color:white;cursor:pointer;font-size:.75rem;transition:all .12s;}
.lb-btn.danger{background:rgba(224,85,85,.3);color:#ff8080;}
.lb-btn.starred{background:rgba(240,192,64,.35);color:var(--star);}
.lb-image-wrap{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:pinch-zoom;}
#lb-img{max-width:100%;max-height:100%;object-fit:contain;}
.lb-footer{position:absolute;bottom:0;left:0;right:0;padding:16px;padding-bottom:max(env(safe-area-inset-bottom),16px);background:linear-gradient(to top,rgba(0,0,0,.8),transparent);text-align:center;}
.lb-name{font-size:.8rem;color:rgba(255,255,255,.6);margin-bottom:2px;}
.lb-date{font-size:.72rem;color:rgba(255,255,255,.35);}

/* ── SELECT BAR ── */
.select-bar{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--border);padding:12px 16px;padding-bottom:max(env(safe-area-inset-bottom),12px);display:none;gap:8px;align-items:center;z-index:50;overflow-x:auto;}
.select-bar.show{display:flex;}
.select-count{font-size:.8rem;color:var(--muted);flex-shrink:0;margin-right:4px;}
.sel-btn{border-radius:10px;padding:11px 14px;font-size:.82rem;cursor:pointer;font-family:inherit;white-space:nowrap;flex-shrink:0;}

/* ── SETTINGS ── */
.settings-section{margin-bottom:22px;}
.settings-label{font-size:.68rem;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px;padding-left:4px;}
.settings-item{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;margin-bottom:6px;transition:all .12s;}
.settings-item:active{background:var(--surface2);}
.settings-item-left{display:flex;align-items:center;gap:12px;}
.settings-icon{font-size:1.1rem;}
.settings-name{font-size:.86rem;}
.settings-desc{font-size:.7rem;color:var(--muted);margin-top:2px;line-height:1.5;}
.settings-arrow{color:var(--muted);font-size:.8rem;}

/* ── TOAST ── */
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:10px 20px;font-size:.8rem;color:var(--text);z-index:999;opacity:0;transition:opacity .2s;white-space:nowrap;pointer-events:none;}
#toast.show{opacity:1;}

/* ── MODAL ── */
.modal-overlay{display:none;position:fixed;inset:0;z-index:500;background:rgba(0,0,0,.75);backdrop-filter:blur(6px);overflow-y:auto;padding:20px;}
.modal-overlay.show{display:flex;align-items:flex-start;justify-content:center;}
.modal-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;width:100%;max-width:440px;margin:auto;}
.modal-head{padding:18px 20px 14px;border-bottom:1px solid var(--border);}
.modal-title{font-size:1rem;font-weight:500;margin-bottom:3px;}
.modal-sub{font-size:.73rem;color:var(--muted);}
.modal-body{padding:16px 20px;display:flex;flex-direction:column;gap:12px;}
.modal-scroll{max-height:52vh;overflow-y:auto;}
.modal-foot{padding:14px 20px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end;}
.m-btn{border-radius:10px;padding:10px 16px;font-size:.82rem;cursor:pointer;font-family:inherit;border:1px solid var(--border);}
.m-btn.primary{background:var(--accent);color:#000;border-color:var(--accent);font-weight:500;}
.m-btn.ghost{background:var(--surface2);color:var(--muted);}

/* ── INPUTS ── */
.vault-input{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:12px 14px;color:var(--text);font-size:.88rem;font-family:inherit;width:100%;outline:none;}
.vault-input:focus{border-color:var(--accent);}

/* album checkbox list */
.album-check-list{display:flex;flex-direction:column;gap:8px;}
.album-check-item{display:flex;align-items:center;gap:12px;padding:10px 14px;background:var(--surface2);border:1px solid var(--border);border-radius:10px;cursor:pointer;transition:all .12s;}
.album-check-item.checked{border-color:var(--accent);background:rgba(200,169,110,.08);}
.album-check-box{width:18px;height:18px;border-radius:5px;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:.7rem;flex-shrink:0;transition:all .12s;}
.album-check-item.checked .album-check-box{background:var(--accent);border-color:var(--accent);color:#000;}
.album-check-name{font-size:.85rem;}
.album-check-count{font-size:.7rem;color:var(--muted);margin-left:auto;}

.swipe-hint{text-align:center;padding:8px 0 4px;font-size:.68rem;color:var(--muted);opacity:.45;}
#file-input,#zip-input{display:none;}
</style>
</head>
<body>

<!-- LOCK -->
<div id="lock-screen">
  <div class="lock-logo">DocSafe</div>
  <div class="lock-tagline">雲端文件保險箱</div>
  <div class="lock-subtitle">安全儲存您的重要文件與合約<br>支援 PDF、Word、試算表格式</div>
  <div class="pin-dots">
    <div class="pin-dot" id="d0"></div><div class="pin-dot" id="d1"></div>
    <div class="pin-dot" id="d2"></div><div class="pin-dot" id="d3"></div>
  </div>
  <div class="numpad">
    <button class="num-btn" onclick="pressPin('1')">1</button>
    <button class="num-btn" onclick="pressPin('2')">2</button>
    <button class="num-btn" onclick="pressPin('3')">3</button>
    <button class="num-btn" onclick="pressPin('4')">4</button>
    <button class="num-btn" onclick="pressPin('5')">5</button>
    <button class="num-btn" onclick="pressPin('6')">6</button>
    <button class="num-btn" onclick="pressPin('7')">7</button>
    <button class="num-btn" onclick="pressPin('8')">8</button>
    <button class="num-btn" onclick="pressPin('9')">9</button>
    <button class="num-btn empty"></button>
    <button class="num-btn" onclick="pressPin('0')">0</button>
    <button class="num-btn del" onclick="deletePin()">⌫</button>
  </div>
  <div class="lock-hint" id="lock-hint">輸入存取密碼<br><span style="opacity:.45">首次使用：設定任意 4 位數字密碼</span></div>
</div>

<!-- APP -->
<div id="app">
  <div class="app-header">
    <div class="app-title" id="app-title">DocSafe</div>
    <div class="header-actions" id="header-actions"></div>
  </div>
  <div class="tabs" id="tabs">
    <div class="tab active" data-tab="home"    onclick="switchTab('home',this)">首頁</div>
    <div class="tab"        data-tab="albums"  onclick="switchTab('albums',this)">相簿</div>
    <div class="tab"        data-tab="starred" onclick="switchTab('starred',this)">星號</div>
    <div class="tab"        data-tab="settings" onclick="switchTab('settings',this)">設定</div>
  </div>
  <div id="upload-progress-bar">
    <div class="up-row">
      <div class="up-label"><span class="up-spinner" id="up-spinner"></span><span id="up-text">正在儲存...</span></div>
      <div class="up-count" id="up-count"></div>
    </div>
    <div class="up-track"><div class="up-fill" id="up-fill"></div></div>
  </div>
  <div class="content" id="content"></div>
  <div class="select-bar" id="select-bar">
    <div class="select-count" id="select-count">已選 0 張</div>
    <button class="sel-btn" onclick="starSelected()" style="background:rgba(240,192,64,.15);border:1px solid var(--star);color:var(--star);">★ 加星</button>
    <button class="sel-btn" onclick="cancelSelect()" style="background:var(--surface2);border:1px solid var(--border);color:var(--muted);">取消</button>
    <button class="sel-btn" onclick="deleteSelected()" style="background:var(--danger);color:white;border:none;">刪除</button>
  </div>
</div>

<!-- LIGHTBOX -->
<div id="lightbox">
  <div class="lb-header">
    <button class="lb-close" onclick="closeLightbox()">✕</button>
    <div class="lb-actions">
      <button class="lb-btn" id="lb-star-btn" onclick="toggleStarCurrent()">☆ 加星</button>
      <button class="lb-btn" onclick="downloadCurrent()">儲存</button>
      <button class="lb-btn danger" onclick="deleteCurrent()">刪除</button>
    </div>
  </div>
  <div class="lb-image-wrap"><img id="lb-img" src="" alt=""></div>
  <div class="lb-footer">
    <div class="lb-name" id="lb-name"></div>
    <div class="lb-date" id="lb-date"></div>
  </div>
</div>

<!-- MODAL: 新增相簿 -->
<div class="modal-overlay" id="modal-new-album">
  <div class="modal-box">
    <div class="modal-head"><div class="modal-title">新增相簿</div></div>
    <div class="modal-body">
      <input class="vault-input" id="new-album-name" placeholder="相簿名稱" maxlength="40">
    </div>
    <div class="modal-foot">
      <button class="m-btn ghost" onclick="closeModal('modal-new-album')">取消</button>
      <button class="m-btn primary" onclick="confirmNewAlbum()">建立</button>
    </div>
  </div>
</div>

<!-- MODAL: 星號篩選相簿 -->
<div class="modal-overlay" id="modal-star-filter">
  <div class="modal-box">
    <div class="modal-head">
      <div class="modal-title">選擇要顯示的相簿</div>
      <div class="modal-sub">只顯示勾選相簿內的星號照片</div>
    </div>
    <div class="modal-body modal-scroll">
      <div class="album-check-list" id="star-album-check-list"></div>
    </div>
    <div class="modal-foot">
      <button class="m-btn ghost" onclick="closeModal('modal-star-filter')">取消</button>
      <button class="m-btn primary" onclick="confirmStarFilter()">套用</button>
    </div>
  </div>
</div>

<!-- MODAL: 下載選擇 -->
<div class="modal-overlay" id="modal-download">
  <div class="modal-box">
    <div class="modal-head">
      <div class="modal-title">打包下載</div>
      <div class="modal-sub">選擇要下載的相簿（可多選）</div>
    </div>
    <div class="modal-body modal-scroll">
      <div class="album-check-list" id="dl-album-check-list"></div>
    </div>
    <div class="modal-foot">
      <button class="m-btn ghost" onclick="closeModal('modal-download')">取消</button>
      <button class="m-btn primary" onclick="confirmDownload()">下載</button>
    </div>
  </div>
</div>

<!-- MODAL: 匯入目標相簿 -->
<div class="modal-overlay" id="modal-import-target">
  <div class="modal-box">
    <div class="modal-head">
      <div class="modal-title">選擇匯入相簿</div>
      <div class="modal-sub">將 zip 內的照片匯入至哪個相簿？</div>
    </div>
    <div class="modal-body">
      <div class="album-check-list" id="import-album-list"></div>
      <div style="margin-top:10px;display:flex;gap:8px;align-items:center;">
        <input class="vault-input" id="import-new-album-name" placeholder="或輸入新相簿名稱..." maxlength="40" style="flex:1;">
      </div>

<script>
// ══════════════════════════════════════
//  IndexedDB  — photos store + albums store
// ══════════════════════════════════════
const IDB_NAME = 'vault_db';
const IDB_VER  = 3;
let db = null;

function openDB() {
  return new Promise((res, rej) => {
    const req = indexedDB.open(IDB_NAME, IDB_VER);
    req.onupgradeneeded = e => {
      const d  = e.target.result;
      const tx = e.target.transaction;
      // photos store
      if (!d.objectStoreNames.contains('photos')) {
        d.createObjectStore('photos', { keyPath:'id' }).createIndex('date','date');
      }
      // albums store (new in v3)
      if (!d.objectStoreNames.contains('albums')) {
        d.createObjectStore('albums', { keyPath:'id' });
      }
      // migrate old photos: add albumId, starred
      const ps = tx.objectStore('photos');
      ps.openCursor().onsuccess = ev => {
        const cur = ev.target.result; if (!cur) return;
        const r = cur.value; let changed = false;
        if (r.starred  === undefined) { r.starred  = 0;    changed = true; }
        if (r.albumId  === undefined) { r.albumId  = null; changed = true; }
        // base64 → blob migration
        if (typeof r.data === 'string' && r.data.startsWith('data:')) {
          try {
            const mime = r.data.split(';')[0].split(':')[1] || 'image/jpeg';
            const b64  = r.data.split(',')[1];
            const bin  = atob(b64); const arr = new Uint8Array(bin.length);
            for (let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
            r.blob = new Blob([arr],{type:mime}); delete r.data; changed = true;
          } catch(_){}
        }
        if (changed) cur.update(r);
        cur.continue();
      };
    };
    req.onsuccess = e => { db = e.target.result; res(); };
    req.onerror   = e => rej(e.target.error);
  });
}

// ── photos ──
function idbPut(rec) {
  if (rec.starred  === undefined) rec.starred  = 0;
  if (rec.albumId  === undefined) rec.albumId  = null;
  return new Promise((res,rej)=>{
    const t=db.transaction('photos','readwrite');
    t.objectStore('photos').put(rec);
    t.oncomplete=res; t.onerror=e=>rej(e.target.error);
  });
}
function idbDel(id) {
  return new Promise((res,rej)=>{
    const t=db.transaction('photos','readwrite');
    t.objectStore('photos').delete(id);
    t.oncomplete=res; t.onerror=e=>rej(e.target.error);
  });
}
function idbAll() {
  return new Promise((res,rej)=>{
    const req=db.transaction('photos','readonly').objectStore('photos').getAll();
    req.onsuccess=e=>{
      const rows=e.target.result
        .filter(r=>r.blob||(typeof r.data==='string'&&r.data.startsWith('data:')))
        .map(r=>{
          const rec={...r,starred:r.starred||0,albumId:r.albumId||null};
          if(!rec.blob&&typeof rec.data==='string'){
            try{
              const mime=rec.data.split(';')[0].split(':')[1]||'image/jpeg';
              const b64=rec.data.split(',')[1]; const bin=atob(b64);
              const arr=new Uint8Array(bin.length);
              for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);
              rec.blob=new Blob([arr],{type:mime});
            }catch(_){return null;}
          }
          return rec;
        }).filter(Boolean);
      rows.sort((a,b)=>(b.date||0)-(a.date||0)); res(rows);
    };
    req.onerror=e=>rej(e.target.error);
  });
}
function idbClearPhotos() {
  return new Promise((res,rej)=>{
    const t=db.transaction('photos','readwrite'); t.objectStore('photos').clear();
    t.oncomplete=res; t.onerror=e=>rej(e.target.error);
  });
}

// ── albums ──
function albumPut(album) {
  return new Promise((res,rej)=>{
    const t=db.transaction('albums','readwrite');
    t.objectStore('albums').put(album);
    t.oncomplete=res; t.onerror=e=>rej(e.target.error);
  });
}
function albumDel(id) {
  return new Promise((res,rej)=>{
    const t=db.transaction('albums','readwrite');
    t.objectStore('albums').delete(id);
    t.oncomplete=res; t.onerror=e=>rej(e.target.error);
  });
}
function albumAll() {
  return new Promise((res,rej)=>{
    const req=db.transaction('albums','readonly').objectStore('albums').getAll();
    req.onsuccess=e=>res(e.target.result.sort((a,b)=>(a.created||0)-(b.created||0)));
    req.onerror=e=>rej(e.target.error);
  });
}

// ══════════════════════════════════════
//  PIN
// ══════════════════════════════════════
const PIN_KEY='vault_pin_v2';
let vaultPin=localStorage.getItem(PIN_KEY);
let pinInput='';

function pressPin(n){if(pinInput.length>=4)return;pinInput+=n;updateDots();if(pinInput.length===4)setTimeout(checkPin,80);}
function deletePin(){pinInput=pinInput.slice(0,-1);updateDots();}
function updateDots(error=false){
  for(let i=0;i<4;i++){const d=document.getElementById('d'+i);d.className='pin-dot';
    if(error)d.classList.add('error');else if(i<pinInput.length)d.classList.add('filled');}
}
function checkPin(){
  if(!vaultPin){vaultPin=pinInput;localStorage.setItem(PIN_KEY,vaultPin);unlockApp();return;}
  if(pinInput===vaultPin){unlockApp();}
  else{updateDots(true);document.getElementById('lock-hint').textContent='密碼錯誤，請重試';
    setTimeout(()=>{pinInput='';updateDots();document.getElementById('lock-hint').innerHTML='輸入存取密碼';},900);}
}
async function unlockApp(){
  document.getElementById('lock-screen').style.display='none';
  document.getElementById('app').style.display='flex';
  state.currentTab='home'; await renderTab();
}

// ══════════════════════════════════════
//  STATE
// ══════════════════════════════════════
let state={
  currentTab:'home',
  currentAlbumId:null,   // null = 相簿列表; string = 相簿內
  starAlbumFilter:null,  // null=全部; Set of albumIds
  selectMode:false,
  selected:new Set(),
};
let photoMeta=[];
let allAlbums=[];

// ══════════════════════════════════════
//  TABS & HEADER
// ══════════════════════════════════════
function switchTab(tab, el){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  state.currentTab=tab;
  state.currentAlbumId=null;
  cancelSelect();
  updateHeader();
  renderTab();
}

function updateHeader(){
  const title=document.getElementById('app-title');
  const actions=document.getElementById('header-actions');
  actions.innerHTML='';

  if(state.currentTab==='home'){
    title.textContent='DocSafe';
  }
  else if(state.currentTab==='albums'){
    if(state.currentAlbumId){
      const alb=allAlbums.find(a=>a.id===state.currentAlbumId);
      title.textContent=alb?alb.name:'相簿';
      // back button
      const back=document.createElement('button');
      back.className='icon-btn back-btn'; back.textContent='← 返回';
      back.onclick=()=>{
        // swipe-down or button: go back to album list
        state.currentAlbumId=null; cancelSelect(); updateHeader(); renderTab();
      };
      actions.appendChild(back);
      // add photo
      const addLbl=document.createElement('label');
      addLbl.htmlFor='file-input'; addLbl.className='icon-btn';
      addLbl.innerHTML='＋ <span>加入</span>'; actions.appendChild(addLbl);
      // select
      const selBtn=document.createElement('button');
      selBtn.className='icon-btn'; selBtn.textContent='☑';
      selBtn.onclick=toggleSelectMode; actions.appendChild(selBtn);
    } else {
      title.textContent='相簿';
      const newBtn=document.createElement('button');
      newBtn.className='icon-btn'; newBtn.innerHTML='＋ <span>新增</span>';
      newBtn.onclick=()=>openModal('modal-new-album'); actions.appendChild(newBtn);
    }
  }
  else if(state.currentTab==='starred'){
    title.textContent='星號照片';
    const filterBtn=document.createElement('button');
    filterBtn.className='icon-btn'+(state.starAlbumFilter?' star-active':'');
    filterBtn.innerHTML='🗂 <span>篩選相簿</span>';
    filterBtn.onclick=openStarFilterModal; actions.appendChild(filterBtn);
  }
  else if(state.currentTab==='settings'){
    title.textContent='設定';
  }
}

async function renderTab(){
  const c=document.getElementById('content');
  allAlbums=await albumAll();
  updateHeader();
  if(state.currentTab==='home')         await renderHome(c);
  else if(state.currentTab==='albums')  await renderAlbums(c);
  else if(state.currentTab==='starred') await renderStarred(c);
  else                                  await renderSettings(c);
}

// ══════════════════════════════════════
//  HOME
// ══════════════════════════════════════
async function renderHome(container){
  let allPhotos=[],starredCount=0;
  try{
    allPhotos=await idbAll();
    starredCount=allPhotos.filter(p=>p.starred===1).length;
  }catch(err){container.innerHTML=`<div class="empty-state"><div class="empty-icon">⚠️</div><div class="empty-title">載入失敗</div><div class="empty-sub">${err.message||err}</div></div>`;return;}

  const wrap=document.createElement('div'); wrap.className='home-wrap';
  wrap.innerHTML=`
    <div><div class="home-greeting">歡迎回來</div><div class="home-sub">您的私密空間已解鎖</div></div>
    <div class="home-stats">
      <div class="stat-box"><div class="stat-num">${allPhotos.length}</div><div class="stat-label">張照片</div></div>
      <div class="stat-box"><div class="stat-num" style="color:var(--star)">${starredCount}</div><div class="stat-label">顆星號</div></div>
      <div class="stat-box"><div class="stat-num" style="color:var(--accent2)">${allAlbums.length}</div><div class="stat-label">個相簿</div></div>
    </div>
    <div class="home-card" onclick="activateTab('albums')">
      <div class="home-card-icon">🗂️</div>
      <div class="home-card-body"><div class="home-card-title">相簿</div><div class="home-card-desc">${allAlbums.length} 個相簿，共 ${allPhotos.length} 張照片</div></div>
      <div class="home-card-arrow">›</div>
    </div>
    <div class="home-card" onclick="activateTab('starred')">
      <div class="home-card-icon">⭐</div>
      <div class="home-card-body"><div class="home-card-title">星號照片</div><div class="home-card-desc">${starredCount} 張加星號的照片</div></div>
      <div class="home-card-arrow">›</div>
    </div>`;
  container.innerHTML=''; container.appendChild(wrap);
}

function activateTab(tab){
  state.currentTab=tab; state.currentAlbumId=null;
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.tab===tab));
  updateHeader(); renderTab();
}

// ══════════════════════════════════════
//  ALBUMS LIST
// ══════════════════════════════════════
async function renderAlbums(container){
  if(state.currentAlbumId){ await renderPhotos(container); return; }
  const allPhotos=await idbAll();
  container.innerHTML='';
  const grid=document.createElement('div'); grid.className='album-grid';

  // new album card
  const newCard=document.createElement('div'); newCard.className='album-new-card';
  newCard.innerHTML=`<div class="album-new-icon">＋</div><div class="album-new-label">新增相簿</div>`;
  newCard.onclick=()=>openModal('modal-new-album');
  grid.appendChild(newCard);

  allAlbums.forEach(alb=>{
    const photos=allPhotos.filter(p=>p.albumId===alb.id);
    const card=document.createElement('div'); card.className='album-card';

    // cover grid (4 thumbs)
    const cover=document.createElement('div'); cover.className='album-cover';
    for(let i=0;i<4;i++){
      if(photos[i]){
        const img=document.createElement('img'); img.loading='lazy';
        const u=URL.createObjectURL(photos[i].blob); img.src=u;
        img.onload=()=>URL.revokeObjectURL(u); cover.appendChild(img);
      } else {
        const ph=document.createElement('div'); ph.className='ac-empty'; ph.textContent='🖼';
        cover.appendChild(ph);
      }
    }

    const info=document.createElement('div'); info.className='album-info';
    info.innerHTML=`<div class="album-name">${alb.name}</div><div class="album-meta">${photos.length} 張照片</div>`;

    // delete button (long-press shows on mobile too via active)
    const delBtn=document.createElement('button'); delBtn.className='album-delete-btn'; delBtn.textContent='✕';
    delBtn.onclick=async e=>{
      e.stopPropagation();
      if(!confirm(`刪除相簿「${alb.name}」及其所有照片？`)) return;
      const ids=photos.map(p=>p.id);
      for(const id of ids) await idbDel(id);
      await albumDel(alb.id);
      showToast(`已刪除相簿「${alb.name}」`);
      await renderTab();
    };

    card.appendChild(cover); card.appendChild(info); card.appendChild(delBtn);
    card.onclick=()=>{ state.currentAlbumId=alb.id; updateHeader(); renderTab(); };
    grid.appendChild(card);
  });

  container.appendChild(grid);

  // swipe down hint (on album list do nothing, on photo view goes back)
  if(allAlbums.length===0){
    const empty=document.createElement('div'); empty.className='empty-state';
    empty.innerHTML=`<div class="empty-icon">🗂️</div><div class="empty-title">尚無相簿</div><div class="empty-sub">點擊「新增」建立第一個相簿</div>`;
    container.appendChild(empty);
  }
}

// ══════════════════════════════════════
//  PHOTOS (inside album)
// ══════════════════════════════════════
async function renderPhotos(container){
  container.innerHTML='<div style="display:flex;align-items:center;justify-content:center;padding:60px 0;color:var(--muted);font-size:.82rem;opacity:.5">載入中...</div>';
  let all=[];
  try{ all=await idbAll(); }
  catch(err){ container.innerHTML=`<div class="empty-state"><div class="empty-icon">⚠️</div><div class="empty-title">載入失敗</div><div class="empty-sub">${err.message||err}</div></div>`;return; }

  photoMeta=all.filter(p=>p.albumId===state.currentAlbumId);
  container.innerHTML='';

  if(!photoMeta.length){
    container.innerHTML=`<div class="empty-state"><div class="empty-icon">📷</div><div class="empty-title">相簿是空的</div><div class="empty-sub">點擊右上角「＋加入」上傳照片</div></div>`;
    setupSwipeDown(container);
    return;
  }

  const grid=document.createElement('div'); grid.className='photo-grid';
  photoMeta.forEach((photo,i)=>{
    const div=document.createElement('div'); div.className='photo-thumb';
    if(state.selected.has(photo.id)) div.classList.add('selected');
    const img=document.createElement('img'); img.loading='lazy';
    const u=URL.createObjectURL(photo.blob); img.src=u; img.onload=()=>URL.revokeObjectURL(u);
    div.appendChild(img);
    if(photo.starred===1){const b=document.createElement('div');b.className='star-badge';b.textContent='★';div.appendChild(b);}
    div.onclick=()=>{ if(state.selectMode) toggleSelect(photo.id,div); else openLightbox(i); };
    div.oncontextmenu=e=>{ e.preventDefault(); if(!state.selectMode){enterSelectMode();toggleSelect(photo.id,div);} };
    grid.appendChild(div);
  });
  container.appendChild(grid);

  const hint=document.createElement('div'); hint.className='swipe-hint';
  hint.textContent=`共 ${photoMeta.length} 張 · 長按選擇 · 下滑返回相簿`;
  container.appendChild(hint);
  setupSwipeDown(container);
}

// swipe down to go back to album list
function setupSwipeDown(container){
  let sy=0;
  container.addEventListener('touchstart',e=>{sy=e.touches[0].clientY;},{passive:true});
  container.addEventListener('touchend',e=>{
    const dy=e.changedTouches[0].clientY-sy;
    if(dy>80&&container.scrollTop===0){
      state.currentAlbumId=null; cancelSelect(); updateHeader(); renderTab();
    }
  },{passive:true});
}

// ══════════════════════════════════════
//  STARRED
// ══════════════════════════════════════
async function renderStarred(container){
  let all=[];
  try{ all=await idbAll(); }
  catch(err){ container.innerHTML=`<div class="empty-state"><div class="empty-icon">⚠️</div><div class="empty-title">載入失敗</div><div class="empty-sub">${err.message}</div></div>`;return; }

  let starred=all.filter(p=>p.starred===1);
  if(state.starAlbumFilter && state.starAlbumFilter.size>0){
    starred=starred.filter(p=>state.starAlbumFilter.has(p.albumId));
  }
  photoMeta=starred;
  container.innerHTML='';

  // filter pills
  const bar=document.createElement('div'); bar.className='filter-bar';
  const allPill=document.createElement('div'); allPill.className='filter-pill'+((!state.starAlbumFilter||state.starAlbumFilter.size===0)?' active star-active':'');
  allPill.textContent='⭐ 全部'; allPill.onclick=()=>{state.starAlbumFilter=null;renderTab();};
  bar.appendChild(allPill);
  allAlbums.forEach(alb=>{
    const pill=document.createElement('div');
    const active=state.starAlbumFilter&&state.starAlbumFilter.has(alb.id);
    pill.className='filter-pill'+(active?' active star-active':'');
    pill.textContent=alb.name;
    pill.onclick=()=>{
      if(!state.starAlbumFilter) state.starAlbumFilter=new Set();
      if(state.starAlbumFilter.has(alb.id)) state.starAlbumFilter.delete(alb.id);
      else state.starAlbumFilter.add(alb.id);
      if(state.starAlbumFilter.size===0) state.starAlbumFilter=null;
      renderTab();
    };
    bar.appendChild(pill);
  });
  container.appendChild(bar);

  if(!starred.length){
    const e=document.createElement('div'); e.className='empty-state';
    e.innerHTML=`<div class="empty-icon">⭐</div><div class="empty-title">沒有星號照片</div><div class="empty-sub">在相簿內點擊照片，按「☆ 加星」</div>`;
    container.appendChild(e); return;
  }

  const grid=document.createElement('div'); grid.className='photo-grid';
  starred.forEach((photo,i)=>{
    const div=document.createElement('div'); div.className='photo-thumb';
    const img=document.createElement('img'); img.loading='lazy';
    const u=URL.createObjectURL(photo.blob); img.src=u; img.onload=()=>URL.revokeObjectURL(u);
    div.appendChild(img);
    const b=document.createElement('div'); b.className='star-badge'; b.textContent='★'; div.appendChild(b);
    div.onclick=()=>openLightbox(i);
    grid.appendChild(div);
  });
  container.appendChild(grid);
  const hint=document.createElement('div'); hint.className='swipe-hint';
  hint.textContent=`${starred.length} 張星號照片`; container.appendChild(hint);
}

// ══════════════════════════════════════
//  LIGHTBOX
// ══════════════════════════════════════
let lbIdx=0, lbStartX=0;
async function openLightbox(idx){lbIdx=idx;await showLbPhoto();document.getElementById('lightbox').classList.add('open');}
async function showLbPhoto(){
  const m=photoMeta[lbIdx]; const img=document.getElementById('lb-img');
  if(img._blobUrl) URL.revokeObjectURL(img._blobUrl);
  img._blobUrl=URL.createObjectURL(m.blob); img.src=img._blobUrl;
  document.getElementById('lb-name').textContent=m.name;
  document.getElementById('lb-date').textContent=new Date(m.date).toLocaleDateString('zh-TW',{year:'numeric',month:'long',day:'numeric',hour:'2-digit',minute:'2-digit'});
  const btn=document.getElementById('lb-star-btn');
  if(m.starred===1){btn.textContent='★ 已加星';btn.classList.add('starred');}
  else{btn.textContent='☆ 加星';btn.classList.remove('starred');}
}
function closeLightbox(){
  document.getElementById('lightbox').classList.remove('open');
  const img=document.getElementById('lb-img');
  if(img._blobUrl){URL.revokeObjectURL(img._blobUrl);img._blobUrl=null;}
}
async function downloadCurrent(){
  const m=photoMeta[lbIdx]; const u=URL.createObjectURL(m.blob);
  const a=document.createElement('a');a.href=u;a.download=m.name;a.click();
  setTimeout(()=>URL.revokeObjectURL(u),1000); showToast('已儲存');
}
async function deleteCurrent(){
  const m=photoMeta[lbIdx];
  if(!confirm(`確定刪除「${m.name}」？`)) return;
  await idbDel(m.id); closeLightbox(); await renderTab(); showToast('已刪除');
}
async function toggleStarCurrent(){
  const m=photoMeta[lbIdx]; m.starred=(m.starred===1)?0:1;
  await idbPut(m); await showLbPhoto();
  showToast(m.starred===1?'已加星號 ★':'已取消星號');
}
const lb=document.getElementById('lightbox');
lb.addEventListener('touchstart',e=>{lbStartX=e.touches[0].clientX;},{passive:true});
lb.addEventListener('touchend',async e=>{
  const dx=e.changedTouches[0].clientX-lbStartX;
  if(Math.abs(dx)>50){
    if(dx<0&&lbIdx<photoMeta.length-1){lbIdx++;await showLbPhoto();}
    else if(dx>0&&lbIdx>0){lbIdx--;await showLbPhoto();}
  }
},{passive:true});

// ══════════════════════════════════════
//  UPLOAD PROGRESS
// ══════════════════════════════════════
let upTimer=null;
function showUploadProgress(done,total){
  const bar=document.getElementById('upload-progress-bar');
  const fill=document.getElementById('up-fill');
  const spin=document.getElementById('up-spinner');
  const stxt=document.getElementById('up-text');
  const ctxt=document.getElementById('up-count');
  bar.classList.add('visible');
  fill.style.width=(total>0?Math.round(done/total*100):0)+'%';
  ctxt.textContent=`${done}/${total}`;
  if(done<total){spin.style.display='inline-block';stxt.textContent='正在儲存...';stxt.parentElement.style.color='var(--accent)';}
  else{spin.style.display='none';stxt.textContent=`✅ 已加入 ${total} 張`;stxt.parentElement.style.color='#6dbf7e';
    clearTimeout(upTimer);upTimer=setTimeout(()=>{bar.classList.remove('visible');fill.style.width='0%';},2500);}
}

async function handleFiles(files){
  if(!files.length) return;
  if(!state.currentAlbumId){ showToast('請先進入一個相簿再上傳'); return; }
  const total=files.length; let done=0; showUploadProgress(0,total);
  for(const file of Array.from(files)){
    await idbPut({id:Date.now()+Math.random(),name:file.name,date:Date.now(),blob:file,starred:0,albumId:state.currentAlbumId});
    done++; showUploadProgress(done,total);
  }
  document.getElementById('file-input').value='';
  await renderTab();
}

function enterSelectMode(){state.selectMode=true;document.getElementById('select-bar').classList.add('show');}

function toggleSelect(id,el){

  else{state.selected.add(id);el.classList.add('selected');}

function cancelSelect(){
  state.selectMode=false;state.selected.clear();

}
async function deleteSelected(){
  if(!state.selected.size) return;

  for(const id of state.selected) await idbDel(id);
  cancelSelect(); await renderTab(); showToast('已刪除選取的照片');

async function starSelected(){
  if(!state.selected.size) return;
  const all=await idbAll();
  for(const id of state.selected){const p=all.find(x=>x.id===id);if(p){p.starred=1;await idbPut(p);}}
  const n=state.selected.size; cancelSelect(); await renderTab(); showToast(`已為 ${n} 張照片加星號 ★`);
}

//  ZIP DOWNLOAD
// ══════════════════════════════════════
let dlSelectedAlbums=new Set();
async function openDownloadModal(){
  dlSelectedAlbums=new Set(allAlbums.map(a=>a.id)); // 預設全選
  const allPhotos=await idbAll();
  const list=document.getElementById('dl-album-check-list'); list.innerHTML='';
  allAlbums.forEach(alb=>{
    const cnt=allPhotos.filter(p=>p.albumId===alb.id).length;
    const item=document.createElement('div'); item.className='album-check-item checked'; item.dataset.id=alb.id;
    item.innerHTML=`<div class="album-check-box">✓</div><div class="album-check-name">${alb.name}</div><div class="album-check-count">${cnt} 張</div>`;
    item.onclick=()=>{
      if(dlSelectedAlbums.has(alb.id)) dlSelectedAlbums.delete(alb.id);
      else dlSelectedAlbums.add(alb.id);
      item.classList.toggle('checked',dlSelectedAlbums.has(alb.id));
      item.querySelector('.album-check-box').textContent=dlSelectedAlbums.has(alb.id)?'✓':'';
    };
    list.appendChild(item);
  });
  openModal('modal-download');
}
async function confirmDownload(){
  if(!dlSelectedAlbums.size){showToast('請選擇至少一個相簿');return;}
  closeModal('modal-download');
  const allPhotos=await idbAll();
  const photos=allPhotos.filter(p=>dlSelectedAlbums.has(p.albumId));
  if(!photos.length){showToast('選取的相簿內沒有照片');return;}
  showToast('打包中，請稍候...');
  try{
    const zip=new JSZip();
    const albumMap=new Map(allAlbums.map(a=>[a.id,a.name]));
    const nameCount={};
    for(const p of photos){
      const folder=albumMap.get(p.albumId)||'未分類';
      const ext=p.name.includes('.')?p.name.slice(p.name.lastIndexOf('.')):'';
      const base=p.name.includes('.')?p.name.slice(0,p.name.lastIndexOf('.')):p.name;
      const key=folder+'/'+p.name; nameCount[key]=(nameCount[key]||0)+1;
      const fname=nameCount[key]>1?`${base}_${nameCount[key]}${ext}`:p.name;
      zip.folder(folder).file(fname,p.blob);
    }
    const blob=await zip.generateAsync({type:'blob',compression:'DEFLATE',compressionOptions:{level:3}});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a'); const ts=new Date().toISOString().slice(0,10);
    a.href=url; a.download=`vault_${ts}.zip`; a.click();
    setTimeout(()=>URL.revokeObjectURL(url),2000);
    showToast(`已打包 ${photos.length} 張照片`);
  }catch(e){showToast('打包失敗：'+e.message);}
}

// ══════════════════════════════════════
//  ZIP IMPORT
// ══════════════════════════════════════
let pendingImport=[]; let dupChoices={}; let importTargetAlbumId=null;

async function handleZipImport(files){
  const file=files[0]; if(!file) return;
  document.getElementById('zip-input').value='';
  showToast('解壓縮中...');
  let zip;
  try{zip=await JSZip.loadAsync(file);}
  catch(e){showToast('無法讀取 zip：'+e.message);return;}
  const IMAGE_RE=/\.(jpe?g|png|gif|webp|heic|heif|bmp|tiff?)$/i;
  const entries=Object.values(zip.files).filter(f=>!f.dir&&IMAGE_RE.test(f.name));
  if(!entries.length){showToast('zip 內沒有找到圖片');return;}

  pendingImport=[];
  for(const entry of entries){
    const ab=await entry.async('arraybuffer');
    const ext=entry.name.slice(entry.name.lastIndexOf('.')+1).toLowerCase();
    const mime={jpg:'image/jpeg',jpeg:'image/jpeg',png:'image/png',gif:'image/gif',webp:'image/webp',heic:'image/heic',heif:'image/heif',bmp:'image/bmp',tif:'image/tiff',tiff:'image/tiff'}[ext]||'image/jpeg';
    const name=entry.name.includes('/')?entry.name.slice(entry.name.lastIndexOf('/')+1):entry.name;
    pendingImport.push({name,blob:new Blob([ab],{type:mime})});
  }
  // show target album modal
  openImportTargetModal();
}

function openImportTargetModal(){
  importTargetAlbumId=null;
  document.getElementById('import-new-album-name').value='';
  const list=document.getElementById('import-album-list'); list.innerHTML='';
  allAlbums.forEach(alb=>{
    const item=document.createElement('div'); item.className='album-check-item'; item.dataset.id=alb.id;
    item.innerHTML=`<div class="album-check-box"></div><div class="album-check-name">${alb.name}</div>`;
    item.onclick=()=>{
      document.querySelectorAll('#import-album-list .album-check-item').forEach(i=>{
        i.classList.remove('checked'); i.querySelector('.album-check-box').textContent='';
      });
      item.classList.add('checked'); item.querySelector('.album-check-box').textContent='✓';
      importTargetAlbumId=alb.id;
      document.getElementById('import-new-album-name').value='';
    };
    list.appendChild(item);
  });
  openModal('modal-import-target');
}

async function confirmImportTarget(){
  const newName=document.getElementById('import-new-album-name').value.trim();
  let targetId=importTargetAlbumId;
  if(newName){
    // create new album
    targetId='alb_'+Date.now();
    await albumPut({id:targetId,name:newName,created:Date.now()});
    allAlbums=await albumAll();
  }
  if(!targetId){showToast('請選擇或建立相簿');return;}
  closeModal('modal-import-target');

  // check duplicates within target album
  const allPhotos=await idbAll();
  const inAlbum=allPhotos.filter(p=>p.albumId===targetId);
  const existNames=new Set(inAlbum.map(p=>p.name));
  const dups=pendingImport.filter(p=>existNames.has(p.name));

  if(!dups.length){
    await doImport(pendingImport,{},targetId);
  } else {
    dupChoices={}; dups.forEach(p=>dupChoices[p.name]='keep');
    showDupModal(dups,inAlbum,targetId);
  }
}

function showDupModal(dups,existing,targetId){
  const list=document.getElementById('dup-list'); list.innerHTML='';
  dups.forEach(newP=>{
    const oldP=existing.find(p=>p.name===newP.name);
    const newUrl=URL.createObjectURL(newP.blob);
    const oldUrl=oldP?URL.createObjectURL(oldP.blob):'';
    const row=document.createElement('div'); row.dataset.name=newP.name;
    row.innerHTML=`
      <div style="font-size:.78rem;color:var(--muted);margin-bottom:8px;word-break:break-all;">📄 ${newP.name}</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;">
        <div style="text-align:center;"><img src="${oldUrl}" style="width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;border:2px solid var(--border);" onload="URL.revokeObjectURL(this.src)"><div style="font-size:.68rem;color:var(--muted);margin-top:4px;">現有</div></div>
        <div style="text-align:center;"><img src="${newUrl}" style="width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;border:2px solid var(--border);" onload="URL.revokeObjectURL(this.src)"><div style="font-size:.68rem;color:var(--muted);margin-top:4px;">匯入</div></div>
      </div>
      <div style="display:flex;gap:8px;">
        <button class="dup-btn" data-choice="keep" onclick="setDupChoice(this,'${newP.name}','keep')" style="flex:1;padding:8px 4px;border-radius:8px;font-size:.76rem;cursor:pointer;font-family:inherit;border:1px solid var(--accent);background:rgba(200,169,110,.15);color:var(--accent);">保留兩者</button>
        <button class="dup-btn" data-choice="overwrite" onclick="setDupChoice(this,'${newP.name}','overwrite')" style="flex:1;padding:8px 4px;border-radius:8px;font-size:.76rem;cursor:pointer;font-family:inherit;border:1px solid var(--border);background:var(--surface2);color:var(--muted);">覆蓋現有</button>
      </div>`;
    list.appendChild(row);
  });
  // store target for later
  document.getElementById('modal-dup').dataset.target=targetId;
  openModal('modal-dup');
}
function setDupChoice(btn,name,choice){
  dupChoices[name]=choice;
  const row=btn.closest('[data-name]');
  row.querySelectorAll('.dup-btn').forEach(b=>{
    const sel=b.dataset.choice===choice;
    b.style.border=sel?'1px solid var(--accent)':'1px solid var(--border)';
    b.style.background=sel?'rgba(200,169,110,.15)':'var(--surface2)';
    b.style.color=sel?'var(--accent)':'var(--muted)';
  });
}
function dupSetAll(choice){
  Object.keys(dupChoices).forEach(name=>{
    dupChoices[name]=choice;
    const row=document.querySelector(`#dup-list [data-name="${CSS.escape(name)}"]`);
    if(row) row.querySelectorAll('.dup-btn').forEach(b=>{
      const sel=b.dataset.choice===choice;
      b.style.border=sel?'1px solid var(--accent)':'1px solid var(--border)';
      b.style.background=sel?'rgba(200,169,110,.15)':'var(--surface2)';
      b.style.color=sel?'var(--accent)':'var(--muted)';
    });
  });
}
async function dupConfirm(){
  const targetId=document.getElementById('modal-dup').dataset.target;
  closeModal('modal-dup');
  await doImport(pendingImport,dupChoices,targetId);
}

async function doImport(photos,choices,targetId){
  const allPhotos=await idbAll();
  const inAlbum=allPhotos.filter(p=>p.albumId===targetId);
  const existMap=new Map(inAlbum.map(p=>[p.name,p]));
  const total=photos.length; let done=0; showUploadProgress(0,total);
  for(const p of photos){
    const choice=choices[p.name]||'keep';
    if(choice==='overwrite'&&existMap.has(p.name)) await idbDel(existMap.get(p.name).id);
    let finalName=p.name;
    if(choice==='keep'&&existMap.has(p.name)){
      const ext=p.name.includes('.')?p.name.slice(p.name.lastIndexOf('.')):'';
      const base=p.name.includes('.')?p.name.slice(0,p.name.lastIndexOf('.')):p.name;
      let n=2; while(existMap.has(`${base}_${n}${ext}`))n++;
      finalName=`${base}_${n}${ext}`;
    }
    await idbPut({id:Date.now()+Math.random(),name:finalName,date:Date.now(),blob:p.blob,starred:0,albumId:targetId});
    done++; showUploadProgress(done,total);
  }
  pendingImport=[]; dupChoices={};
  await renderTab(); showToast(`已匯入 ${total} 張照片`);
}
